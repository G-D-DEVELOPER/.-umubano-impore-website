<style>
  :root{
    --green-deep:#1E7A46;
    --green-mid:#1E7A46;
    --green-bright:#1E7A46;
    --green-pale:#CFEAD9;
    --green-line:#9FD4B3;
    --white:#FFFFFF;
    --ink:#000000;
    --muted:#5C7266;
    --danger:#B4472C;
    --shadow: 0 12px 30px rgba(20,35,28,0.12);
    --font-heading:'Fraunces', serif;
    --font-body:'Karla', sans-serif;
    --page-bg:#FFFFFF;
    --text-scale:1;
    --logo-scale:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background: var(--page-bg);
    color: var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:var(--font-heading);
    font-weight:600;
    color: var(--green-deep);
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- weave signature pattern ---------- */
  .weave{
    height:14px;
    width:100%;
    background-image: repeating-linear-gradient(115deg, var(--green-bright) 0 6px, transparent 6px 12px),
                       repeating-linear-gradient(65deg, var(--green-deep) 0 6px, transparent 6px 12px);
    background-size: 24px 14px;
    background-repeat: repeat-x;
    opacity:0.9;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background: var(--white);
    color: var(--green-deep);
    border-bottom:1px solid var(--green-line);
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px;
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .menu-btn{
    background: transparent;
    border:none; border-radius:10px;
    width:44px; height:44px; flex:none;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px;
  }
  .menu-btn span{display:block; width:20px; height:2px; background:var(--green-deep); border-radius:2px;}
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand-logo{width:calc(72px * var(--logo-scale)); height:auto; border-radius:12px; display:block; flex:none;}
  .brand .name{font-family:var(--font-heading); font-weight:700; font-size:22px; letter-spacing:0.02em;}
  .brand .tag{font-size:11px; color:var(--green-line); letter-spacing:0.08em; text-transform:uppercase;}
  .admin-area{display:flex; align-items:center; gap:10px;}
  .pill-btn{
    border:1px solid rgba(255,255,255,0.4);
    background:transparent; color:var(--white);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .pill-btn.solid{background:var(--green-bright); border-color:var(--green-bright);}
  .admin-badge{
    background: var(--green-bright); color:var(--white);
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;
    text-transform:uppercase; letter-spacing:0.05em;
  }

  /* ---------- sidebar ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,35,28,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:49;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sidebar{
    position:fixed; top:0; left:0; height:100%; width:300px; max-width:85vw;
    background:var(--white); z-index:50; box-shadow:var(--shadow);
    transform:translateX(-105%); transition:transform .28s ease;
    display:flex; flex-direction:column;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{
    padding:20px; background:var(--green-deep); color:var(--white);
    display:flex; align-items:center; justify-content:space-between;
  }
  .sidebar-head .close-btn{background:none;border:none;color:var(--white);font-size:22px;line-height:1;}
  .sidebar-nav{overflow-y:auto; padding:8px 0 24px;}
  .nav-group{border-bottom:1px solid var(--green-line);}
  .nav-group-btn{
    width:100%; text-align:left; background:none; border:none;
    padding:14px 20px; font-family:var(--font-heading); font-weight:600; font-size:15.5px;
    color:var(--green-deep); display:flex; justify-content:space-between; align-items:center;
  }
  .nav-group-btn .chev{transition:transform .2s ease; color:var(--green-bright);}
  .nav-group.open .chev{transform:rotate(90deg);}
  .nav-sub{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .nav-group.open .nav-sub{max-height:400px;}
  .nav-sub-btn{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 20px 10px 34px; font-size:14px; color:var(--muted);
  }
  .nav-sub-btn:hover{color:var(--green-bright); background:var(--green-pale);}
  .nav-sub-btn.active{color:var(--green-bright); font-weight:700; background:var(--green-pale);}
  .nav-group-btn.active-top{color:var(--green-bright);}
  .admin-nav-btn{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--green-deep); border-top:1px dashed var(--green-line); margin-top:2px; padding-top:12px;}
  .admin-dot{width:8px; height:8px; border-radius:50%; background:var(--green-bright); flex:none;}
  .admin-dot.off{background:var(--muted);}
  .lang-switcher{padding:18px 20px 8px;}
  .lang-title{font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-weight:700; margin-bottom:10px;}
  .lang-row{display:flex; flex-wrap:wrap; gap:8px;}
  .lang-pill{
    border:1px solid var(--green-line); background:var(--white); color:var(--green-mid);
    padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .lang-pill.active{background:var(--green-bright); border-color:var(--green-bright); color:var(--white);}

  /* ---------- layout ---------- */
  .page-wrap{max-width:880px; margin:0 auto; padding:32px 20px 80px;}
  .hero-photo{
    position:relative; overflow:hidden;
    background:var(--green-deep);
  }
  .hero-photo img{width:100%; display:block; aspect-ratio:16/9; object-fit:cover;}
  /* The photo is left bright and even across its whole width; the title stays
     readable through a text shadow rather than by darkening the picture. */
  .hero-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%);
    pointer-events:none;
  }
  .hero-banner{
    position:absolute; left:5%; bottom:8%; max-width:70%; z-index:2;
  }
  .hero-banner h1{
    color:var(--white); font-size:clamp(28px, 7vw, 52px); margin:0; letter-spacing:0.01em;
    line-height:1.05; text-shadow:0 2px 14px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6);
  }
  .hero-banner .hero-sub{color:var(--white); font-size:clamp(12px, 1.8vw, 15px); font-weight:600; margin-top:6px;}
  .hero-divider{width:70px; height:4px; background:var(--green-bright); margin:14px 0 16px; border-radius:2px;}
  .hero-subtitle{color:var(--white); font-size:clamp(14px, 2vw, 18px); margin:0 0 20px; opacity:0.95;}
  .hero-cta-btn{
    background:var(--green-bright); color:var(--white); border:none; border-radius:8px;
    padding:13px 24px; font-weight:700; font-size:13.5px; text-transform:uppercase;
    letter-spacing:0.03em; cursor:pointer;
  }
  @media (max-width:520px){ .hero-banner{padding:12px 16px; max-width:80%;} }

  .hero-photo .hero-logo-badge{
    position:absolute; top:5%; right:4%; z-index:2;
    width:clamp(64px, 12vw, 130px); height:auto; aspect-ratio:auto; display:block;
    border-radius:10px; box-shadow:0 4px 18px rgba(0,0,0,0.35);
  }

  /* Organisation name on the left, page name on the right, written over the photo. */
  .page-hero-title{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    display:flex; align-items:baseline; justify-content:space-between; gap:18px; flex-wrap:wrap;
    padding:22px clamp(16px, 5vw, 48px);
  }
  .page-hero-title .ph-brand{
    font-family:var(--font-heading); font-weight:700; color:var(--white);
    font-size:clamp(16px, 2.6vw, 26px); letter-spacing:0.02em;
    text-shadow:0 2px 12px rgba(0,0,0,0.75);
  }
  .page-hero-title .ph-page{
    font-family:var(--font-heading); font-weight:700; color:var(--white);
    font-size:clamp(18px, 3.4vw, 34px); line-height:1.15;
    text-shadow:0 2px 12px rgba(0,0,0,0.75);
  }
  @media (max-width:560px){
    .page-hero-title{flex-direction:column; gap:4px; padding-bottom:16px;}
  }

  .feed-section-title{text-align:center; font-size:22px; text-transform:uppercase; letter-spacing:0.03em; margin:8px 0 2px;}
  .feed-section-underline{width:40px; height:3px; background:var(--green-bright); margin:0 auto 26px; border-radius:2px;}

  .story-acronym{font-weight:700; color:var(--green-deep) !important;}
  .story-card strong, .post-title strong, .post-text strong{font-weight:700; color:var(--green-deep);}
  .story-card em, .post-title em, .post-text em{font-style:italic;}
  .story-card u, .post-title u, .post-text u{text-decoration:underline;}
  .story-card del, .post-title del, .post-text del{text-decoration:line-through; opacity:0.75;}

  .crumb{font-size:12.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--green-bright); font-weight:700; margin-bottom:6px;}
  .section-title{font-size:26px; margin:0 0 6px;}
  .section-desc{color:var(--muted); line-height:1.6; margin:0 0 24px; max-width:64ch; font-size:calc(15px * var(--text-scale));}

  /* ---------- page header image (admin-uploadable banner per page) ---------- */
  .page-header-photo{position:relative; border-radius:16px; overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow);}
  .page-header-photo img{width:100%; aspect-ratio:16/6; object-fit:cover; display:block;}
  .page-header-remove{
    position:absolute; top:10px; right:10px; background:rgba(20,35,28,0.75); color:#fff;
    border:none; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:600;
  }
  .page-header-upload{display:inline-flex; margin-bottom:18px;}

  /* ---------- editable home story ---------- */
  .story-card{
    position:relative; margin-bottom:22px;
  }
  .story-card p{margin:0 0 14px; line-height:1.75; color:var(--ink); font-size:calc(18px * var(--text-scale));}
  .story-card p:last-child{margin-bottom:0;}
  .story-edit-btn{
    position:absolute; top:16px; right:16px; background:var(--white); border:1px solid var(--green-bright);
    color:var(--green-mid); font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:999px; z-index:2;
  }
  .story-gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:14px;}
  .story-gallery img{width:100%; border-radius:10px; display:block; aspect-ratio:1.2; object-fit:cover;}
  .story-edit-form textarea.story-field{
    width:100%; min-height:100px; border:1px solid var(--green-line); border-radius:10px;
    padding:12px; font-family:inherit; font-size:14.5px; color:var(--ink); resize:vertical; margin-bottom:14px;
  }
  .story-edit-form .story-gallery{margin:12px 0;}
  .story-edit-form .img-preview{max-width:140px; margin-top:0;}
  .field-label{display:block; font-size:12.5px; font-weight:700; color:var(--green-mid); text-transform:uppercase; letter-spacing:0.04em; margin:16px 0 6px;}
  .field-label:first-of-type{margin-top:0;}
  .img-preview.single{max-width:220px;}
  .img-preview.single img{width:100%; border-radius:10px; display:block;}

  /* Plain content, no coloured box — just the photo and text sitting on the
     normal page background like the rest of the site. */
  .founder-section{
    text-align:center; padding:0;
  }
  .founder-title{font-size:calc(clamp(24px,4.5vw,34px) * var(--text-scale)); line-height:1.15; margin:0 0 18px; color:#000;}
  .founder-photo{width:200px; border-radius:14px; display:block; margin:0 auto 16px; box-shadow:0 6px 18px rgba(0,0,0,0.15); border:3px solid var(--green-line);}
  .founder-name{font-weight:700; color:#000; font-size:18px; margin-bottom:16px; font-family:var(--font-heading);}
  .founder-section p{
    text-align:center; font-family:var(--font-heading); font-size:calc(clamp(19px,2.6vw,25px) * var(--text-scale));
    font-weight:700; font-style:normal; line-height:1.7; color:#000;
  }

  /* ---------- composer ---------- */
  .composer{
    background:var(--white); border:1px solid var(--green-line); border-radius:14px;
    padding:16px; margin-bottom:24px;
  }
  .composer textarea{
    width:100%; min-height:80px; resize:vertical; border:1px solid var(--green-line);
    border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14.5px; color:var(--ink);
  }
  .composer-title-input{
    width:100%; border:1px solid var(--green-line); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); margin-bottom:8px;
  }
  .edit-hint{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  .lang-tabs{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .translate-btn{
    background:var(--green-pale); border:1px solid var(--green-bright); color:var(--green-mid);
    font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; margin:8px 0;
  }
  .translate-btn:disabled{opacity:0.6;}
  .format-toolbar{display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap;}
  .fmt-btn{
    background:var(--white); border:1px solid var(--green-line); color:var(--green-deep);
    width:30px; height:30px; border-radius:7px; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .fmt-btn i{font-style:italic;}
  .fmt-btn.fmt-case{width:auto; padding:0 8px; font-size:11px; font-weight:700; letter-spacing:0.02em;}
  .fmt-hint{font-size:11.5px; color:var(--muted); margin-left:4px;}
  .composer-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .file-label{
    font-size:13px; color:var(--green-mid); font-weight:600; border:1px dashed var(--green-bright);
    padding:8px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;
  }
  .file-label input{display:none;}
  .img-preview{margin-top:10px; max-width:220px; border-radius:10px; overflow:hidden; border:1px solid var(--green-line); position:relative;}
  .img-preview img{display:block; width:100%;}
  .img-preview button{
    position:absolute; top:6px; right:6px; background:rgba(20,35,28,0.7); color:#fff;
    border:none; border-radius:6px; padding:2px 8px; font-size:12px;
  }
  .post-btn{
    background:var(--green-bright); color:var(--white); border:none; border-radius:999px;
    padding:10px 20px; font-weight:700; font-size:14px;
  }
  .post-btn:disabled{opacity:0.5; cursor:default;}

  .media-gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin:12px 0;}
  .media-item{
    background:var(--white); border:1px solid var(--green-line); border-radius:12px;
    overflow:hidden; position:relative; padding-bottom:8px;
  }
  .media-item img, .media-item video{width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#000;}
  .media-caption-input{
    width:calc(100% - 16px); margin:8px 8px 0; border:1px solid var(--green-line); border-radius:8px;
    padding:6px 8px; font-family:inherit; font-size:12.5px; color:var(--ink); resize:vertical; min-height:44px;
  }
  .media-remove-btn{
    position:absolute; top:6px; right:6px; background:rgba(20,35,28,0.72); color:#fff;
    border:none; border-radius:6px; padding:2px 8px; font-size:11.5px;
  }

  /* ---------- feed (animated sliding carousel) ---------- */
  .feed-carousel-wrap{position:relative; padding:0 4px;}
  .feed-grid{
    display:flex; align-items:flex-start; gap:20px; overflow-x:auto; scroll-snap-type:x proximity;
    padding:4px 4px 12px; scroll-behavior:smooth;
  }
  .feed-grid::-webkit-scrollbar{height:7px;}
  .feed-grid::-webkit-scrollbar-thumb{background:var(--green-line); border-radius:4px;}
  /* The posts grid breaks out wider than the text column so several tiles fit
     across the row, the way a photo wall should read. */
  .feed{width:min(1200px, calc(100vw - 32px)); margin-left:50%; transform:translateX(-50%);}
  .feed-grid.layout-grid{flex-wrap:wrap; justify-content:center; overflow-x:visible; scroll-snap-type:none; gap:14px;}
  .feed-grid.layout-grid .post-card{flex:0 1 180px;}
  .feed-grid.layout-list{flex-direction:column; overflow-x:visible; scroll-snap-type:none;}
  .feed-grid.layout-list .post-card{flex:1 1 auto; width:100%; aspect-ratio:16/9;}
  .feed-grid.layout-list .post-title{font-size:20px;}
  @media (max-width:520px){
    .feed-grid.layout-grid .post-card{flex:0 1 150px;}
    .post-card .post-title{font-size:13px;}
  }

  /* Photo-tile card: the picture fills the whole tile and the title sits on top of
     it over a dark fade, so every card reads as one clean image block. */
  .post-card{
    position:relative; flex:0 0 200px; scroll-snap-align:start;
    aspect-ratio:3/4; border:3px solid #4DA8E8; border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
    overflow:hidden; display:block; cursor:pointer; background:var(--green-deep);
    opacity:0; animation:cardSlideIn 0.6s ease forwards;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .post-card:hover{transform:translateY(-4px); box-shadow:0 10px 26px rgba(0,0,0,0.28);}
  .post-card .post-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block; aspect-ratio:auto;
  }
  .post-card-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.45) 34%, rgba(0,0,0,0.05) 62%, rgba(0,0,0,0) 100%);
  }
  .post-card .post-body{
    position:absolute; left:0; right:0; bottom:0;
    padding:14px 12px 16px; text-align:center;
  }
  .post-card .post-title{
    color:var(--white); font-size:15px; line-height:1.25; margin:0;
    text-transform:uppercase; letter-spacing:0.02em; font-weight:700;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .post-tag-pill{
    position:absolute; top:10px; left:10px; z-index:3;
    display:inline-block; background:var(--green-bright); color:var(--white); font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.04em; font-weight:700; padding:4px 11px;
    border-radius:999px;
  }
  .post-date-row{font-size:12px; font-weight:600; color:rgba(255,255,255,0.9); text-align:center; margin:6px 0 0; text-shadow:0 1px 6px rgba(0,0,0,0.6);}
  .post-tile-readmore{
    font-size:12px; font-weight:700; color:var(--white); text-align:center; margin-top:7px;
    opacity:0.85; text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }
  .post-card:hover .post-tile-readmore{opacity:1;}
  .post-card-admin{position:absolute; top:10px; right:10px; z-index:4; display:flex; gap:6px;}
  .post-card-multi{flex-basis:200px;}
  .post-media-img{width:100%; border-radius:10px; display:block; margin:10px 0 6px;}
  .post-media-caption{margin-bottom:16px;}
  @keyframes cardSlideIn{
    from{opacity:0; transform:translateY(26px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .post-card{animation:none; opacity:1;}
  }
  .post-img{width:100%; aspect-ratio:16/10; object-fit:cover; display:block;}
  .post-body{padding:16px 18px 18px;}
  .post-title{font-size:calc(17px * var(--text-scale)); margin:0 0 6px; line-height:1.3;}
  .post-date{font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:10px;}
  .post-text{white-space:pre-wrap; line-height:1.6; font-size:calc(14.5px * var(--text-scale)); color:var(--ink); margin:0 0 8px;}
  .read-more-btn{
    background:none; border:none; color:#2C8CBE; font-weight:700; font-size:13.5px;
    padding:0; white-space:nowrap;
  }
  .del-btn{
    background:rgba(255,255,255,0.92); border:1px solid var(--danger); color:var(--danger);
    border-radius:8px; font-size:11.5px; padding:4px 9px; font-weight:700;
  }
  .edit-btn{
    background:rgba(255,255,255,0.92); border:1px solid var(--green-bright); color:var(--green-deep);
    border-radius:8px; font-size:11.5px; padding:4px 9px; font-weight:700;
  }
  .mp-order-btn{
    background:var(--green-pale); border:1px solid var(--green-line); color:var(--green-deep);
    border-radius:4px; width:22px; height:16px; font-size:9px; line-height:1;
    padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .mp-order-btn:disabled{opacity:0.3; cursor:default;}
  .feed-nav{
    position:absolute; top:45%; transform:translateY(-50%); z-index:5;
    background:var(--white); border:1px solid var(--green-line); color:var(--green-deep);
    width:34px; height:34px; border-radius:50%; font-size:19px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .feed-nav-prev{left:-6px;}
  .feed-nav-next{right:-6px;}
  @media (max-width:640px){ .feed-nav{display:none;} }
  .loading-state{text-align:center; padding:30px; color:var(--muted); font-size:14px;}

  /* ---------- site footer ---------- */
  .site-footer{
    background:linear-gradient(100deg, var(--green-deep) 0%, var(--green-bright) 55%, #7FBF4D 100%);
    color:var(--white); padding:46px 22px 34px; margin-top:40px;
  }
  .footer-inner{
    max-width:1120px; margin:0 auto;
    display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; gap:34px;
  }
  @media (max-width:900px){ .footer-inner{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .footer-inner{grid-template-columns:1fr; gap:26px;} }
  .footer-brand-logo{width:66px; height:auto; background:rgba(255,255,255,0.92); border-radius:12px; padding:6px; display:block; margin-bottom:14px;}
  .footer-brand-name{font-family:var(--font-heading); font-weight:700; font-size:calc(19px * var(--text-scale)); margin-bottom:6px;}
  .footer-brand-tagline{font-size:calc(13.5px * var(--text-scale)); opacity:0.92; line-height:1.55; margin-bottom:18px;}
  .footer-cta-btn{
    background:transparent; color:var(--white); border:2px solid var(--white);
    border-radius:999px; padding:12px 26px; font-weight:700; font-size:14.5px;
  }
  .footer-cta-btn:hover{background:var(--white); color:var(--green-deep);}
  .footer-col h4{
    font-family:var(--font-heading); color:var(--white); font-size:19px;
    margin:0 0 12px; font-weight:700;
  }
  .footer-link{
    display:block; background:none; border:none; padding:3px 0; text-align:left;
    color:var(--white); font-size:14px; opacity:0.93; font-family:inherit; line-height:1.5;
  }
  .footer-link:hover{text-decoration:underline; opacity:1;}
  .footer-link.sub{font-size:13.5px; opacity:0.9; padding:2px 0;}
  .footer-sitemap-col{grid-column:span 2;}
  @media (max-width:900px){ .footer-sitemap-col{grid-column:span 2;} }
  @media (max-width:560px){ .footer-sitemap-col{grid-column:span 1;} }
  .footer-sitemap{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:20px 22px; margin-top:12px;
  }
  .sitemap-heading{
    background:none; border:none; padding:0 0 6px; text-align:left;
    color:var(--white); font-family:var(--font-heading); font-weight:700; font-size:15px;
  }
  .sitemap-heading:hover{text-decoration:underline;}
  .sitemap-list{list-style:none; margin:0; padding:0;}
  .sitemap-list li{position:relative; padding-left:14px;}
  .sitemap-list li::before{
    content:''; position:absolute; left:0; top:10px;
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.85);
  }
  .footer-text{font-size:14px; line-height:1.75; opacity:0.95; margin:0 0 6px;}
  .footer-text strong{font-weight:700;}
  .footer-social{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
  .footer-social a{
    width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center; color:var(--white);
    text-decoration:none; border:1px solid rgba(255,255,255,0.35);
  }
  .footer-social a:hover{background:var(--white); color:var(--green-deep);}
  .footer-bottom{
    max-width:1120px; margin:30px auto 0; padding-top:18px;
    border-top:1px solid rgba(255,255,255,0.28);
    font-size:12.5px; opacity:0.9; display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between;
  }
  .footer-edit-btn{
    background:rgba(255,255,255,0.16); color:var(--white); border:1px solid rgba(255,255,255,0.5);
    border-radius:8px; padding:6px 14px; font-size:12.5px; font-weight:700;
  }
  .to-top-btn{
    position:fixed; right:16px; bottom:16px; z-index:45;
    width:44px; height:44px; border-radius:10px; border:none;
    background:var(--green-deep); color:var(--white); font-size:20px; line-height:1;
    box-shadow:0 6px 18px rgba(0,0,0,0.25); display:none;
  }
  .to-top-btn.show{display:block;}


  /* ---------- modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(20,35,28,0.55); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-bg.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--white); border-radius:16px; padding:26px; width:100%; max-width:340px;
    box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;
  }
  .modal.modal-wide{max-width:640px;}
  /* Full-size photo viewer — tapping any small gallery thumbnail (introduction
     photos, founder story photos) opens the same image here at full size. */
  .lightbox-bg{
    position:fixed; inset:0; background:rgba(10,20,16,0.88); z-index:70;
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .2s ease; cursor:zoom-out;
  }
  .lightbox-bg.open{opacity:1; pointer-events:auto;}
  .lightbox-bg img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.5); cursor:default;}
  .lightbox-close{
    position:fixed; top:18px; right:22px; background:rgba(255,255,255,0.15); border:none; color:var(--white);
    font-size:22px; line-height:1; width:40px; height:40px; border-radius:50%; cursor:pointer; z-index:71;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.28);}
  #storyView .story-gallery img, #pageIntroView .story-gallery img{cursor:zoom-in;}
  /* Full post reading view — plain page content (no popup, no dark overlay, no
     green tint) so a very long post never distorts the card grid it came from. */
  .post-detail-back{
    background:none; border:none; color:var(--green-deep); font-weight:700; font-size:14px;
    padding:0; margin-bottom:16px; cursor:pointer;
  }
  .post-detail-back:hover{text-decoration:underline;}
  .post-detail-title{font-size:calc(clamp(22px,4vw,30px) * var(--text-scale)); margin:0 0 10px; line-height:1.25;}
  .post-view-tag{position:static; display:inline-block; margin-bottom:8px;}
  .post-view-date{font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:14px;}
  .post-view-img{width:100%; border-radius:10px; display:block; margin-bottom:14px;}
  .post-view-text{white-space:pre-wrap; line-height:1.7; font-size:calc(15.5px * var(--text-scale)); color:var(--ink);}
  .modal h3{margin:0 0 6px;}
  .modal p{color:var(--muted); font-size:13.5px; margin:0 0 16px; line-height:1.5;}
  .modal input{
    width:100%; padding:10px 12px; border:1px solid var(--green-line); border-radius:8px;
    font-size:14px; margin-bottom:10px;
  }
  .modal-err{color:var(--danger); font-size:12.5px; margin:-4px 0 10px; display:none;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .btn-ghost{background:none; border:1px solid var(--green-line); border-radius:8px; padding:9px 16px; font-size:13.5px; color:var(--muted);}
  .btn-solid{background:var(--green-bright); border:none; border-radius:8px; padding:9px 16px; font-size:13.5px; color:#fff; font-weight:700;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--green-deep); color:#fff; padding:12px 20px; border-radius:10px;
    font-size:13.5px; box-shadow:var(--shadow); z-index:80; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--danger);}

  @media (max-width:600px){
    .brand .name{font-size:17px;}
    .brand-logo{width:calc(52px * var(--logo-scale));}
  }
  @media (prefers-reduced-motion: reduce){
    .sidebar,.overlay,.nav-sub,.chev,.modal-bg{transition:none !important;}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ---------------- config ----------------
  // A real, hosted database: every visitor's browser reads from and writes to
  // the same place, which is what actually stops posts from ever being lost or
  // stuck in just one browser. The anon key below is meant to be public — it is
  // useless for writing anything without also being signed in as admin, because
  // of the access rules (row-level security) set up on the database itself.
  var SUPABASE_URL = "https://nuddsibbayjjhbyisayk.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51ZGRzaWJiYXlqamhieWlzYXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTMyOTQsImV4cCI6MjEwMDk2OTI5NH0.MlhI2t10-qihiM6YLbtn_S6DEwvE26hY-UXEAPtb59M";

  var supabaseClient = (window.supabase && SUPABASE_URL)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---------------- where content is saved ----------------
  // Supabase (a real, shared database) is used whenever it's reachable — which is
  // everywhere this file is opened, including hosted on your own domain. If the
  // Supabase library failed to load (e.g. no internet connection right now) this
  // falls back to Claude.ai's own storage when available, or otherwise this one
  // browser's local storage, purely so the site doesn't go completely blank.
  // Those fallback places are NOT the same database, and are not kept in sync with
  // it automatically — Settings > Backup can move content between them by hand.
  var siteStorage = (function(){
    if(supabaseClient){
      return {
        isNative: true,
        isSupabase: true,
        get: async function(key){
          var res = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
          if(res.error) throw res.error;
          return res.data ? { value: res.data.value } : null;
        },
        set: async function(key, value){
          var res = await supabaseClient.from('kv_store').upsert({ key: key, value: value });
          if(res.error) throw res.error;
        },
        delete: async function(key){
          var res = await supabaseClient.from('kv_store').delete().eq('key', key);
          if(res.error) throw res.error;
        },
        list: async function(prefix){
          var q = supabaseClient.from('kv_store').select('key');
          q = prefix ? q.like('key', prefix+'%') : q.like('key', '%');
          var res = await q;
          if(res.error) throw res.error;
          return { keys: (res.data||[]).map(function(r){ return r.key; }) };
        },
        // Fetches every key AND its value matching a prefix in one round trip,
        // instead of listing keys and then fetching each one separately — this is
        // what makes a page's posts appear quickly instead of one request per post.
        listValues: async function(prefix){
          var q = supabaseClient.from('kv_store').select('key,value');
          q = prefix ? q.like('key', prefix+'%') : q.like('key', '%');
          var res = await q;
          if(res.error) throw res.error;
          return { items: (res.data||[]).map(function(r){ return { key:r.key, value:r.value }; }) };
        }
      };
    }
    var native = window.storage;
    if(native && typeof native.get === 'function'){
      native.isNative = true;
      return native;
    }
    var PREFIX = 'umubano_';
    function later(fn){ return new Promise(function(resolve, reject){
      try{ resolve(fn()); }catch(err){ reject(err); }
    }); }
    return {
      isNative: false,
      get: function(key){ return later(function(){
        var v = localStorage.getItem(PREFIX+key);
        return v === null ? null : { value:v };
      }); },
      set: function(key, value){ return later(function(){
        localStorage.setItem(PREFIX+key, value);
      }); },
      delete: function(key){ return later(function(){
        localStorage.removeItem(PREFIX+key);
      }); },
      list: function(prefix){ return later(function(){
        var keys = [];
        for(var i=0;i<localStorage.length;i++){
          var full = localStorage.key(i);
          if(full && full.indexOf(PREFIX)===0){
            var bare = full.slice(PREFIX.length);
            if(bare.indexOf(prefix||'')===0) keys.push(bare);
          }
        }
        return { keys:keys };
      }); },
      listValues: function(prefix){ return later(function(){
        var items = [];
        for(var i=0;i<localStorage.length;i++){
          var full = localStorage.key(i);
          if(full && full.indexOf(PREFIX)===0){
            var bare = full.slice(PREFIX.length);
            if(bare.indexOf(prefix||'')===0) items.push({ key:bare, value:localStorage.getItem(full) });
          }
        }
        return { items:items };
      }); }
    };
  })();

  var PAGES = [
    { id:'home', label:{en:'Home',fr:'Accueil',rw:'Ahabanza'}, hidden:true, sections:[{id:'home', label:{en:'Home',fr:'Accueil',rw:'Ahabanza'}}] },
    { id:'organisation', label:{en:'Our non-profit organisation',fr:'Notre association (ASBL)',rw:'Umuryango wacu utari uwa Leta'}, sections:[
        {id:'mission', label:{en:'Mission',fr:'Mission',rw:'Intego'}, desc:{en:'Why Umubano Impore exists and the change we work toward.',fr:"Pourquoi Umubano Impore existe et le changement que nous visons.",rw:"Impamvu Umubano Impore ibaho n'impinduka dushaka gukora."}},
        {id:'structure', label:{en:'Structure',fr:'Structure',rw:'Imiterere'}, desc:{en:'How the organisation is organised and run.',fr:"Comment l'organisation est structurée et gérée.",rw:"Uko umuryango ugenzurwa kandi uyoborwa."}},
        {id:'board', label:{en:'Board members',fr:"Membres du conseil d'administration",rw:"Abagize Inama y'Ubuyobozi"}, desc:{en:'The people who guide Umubano Impore.',fr:'Les personnes qui guident Umubano Impore.',rw:'Abantu bayobora Umubano Impore.'}},
        {id:'documents', label:{en:'Documents',fr:'Documents',rw:'Inyandiko'}, desc:{en:'Statutes, reports and other official documents.',fr:'Statuts, rapports et autres documents officiels.',rw:"Amategeko shingiro, raporo n'izindi nyandiko z'umwuga."}}
      ]},
    { id:'projects', label:{en:'Projects',fr:'Projets',rw:'Imishinga'}, sections:[

  function applyOrder(items, orderIds){
    if(!orderIds || !orderIds.length) return items.slice();
    var byId = {};
    items.forEach(function(it){ byId[it.id] = it; });
    var ordered = orderIds.map(function(id){ return byId[id]; }).filter(Boolean);
    items.forEach(function(it){ if(ordered.indexOf(it)===-1) ordered.push(it); });
    return ordered;
  }

  // ---------------- translation (via Claude API) ----------------
  // Free, keyless translation — works from any browser, on any hosting, with no
  // account or API key. This is the primary path now that the site runs outside
  // Claude.ai most of the time. A single call is kept under roughly 1500
  // characters (comfortably inside every browser/server's URL length limit) by
  // splitting longer text into paragraphs, and further into sentences if a
  // single paragraph is still too long, then rejoining the translated pieces in
  // the same shape as the original.
  var GOOGLE_LANG_CODE = { fr:'fr', rw:'rw' };
  var MAX_TRANSLATE_CHUNK = 1500;

  async function translateChunkViaGoogle(chunk, targetCode){
    if(!chunk) return '';
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+GOOGLE_LANG_CODE[targetCode]+'&dt=t&q='+encodeURIComponent(chunk);
    var response = await fetch(url);
    if(!response.ok) throw new Error('Translate request failed: '+response.status);
    var data = await response.json();
    var segments = data && data[0];
    if(!segments || !segments.length) throw new Error('Translate returned no segments');
    return segments.map(function(seg){ return seg[0] || ''; }).join('');
  }

  function splitForTranslation(text){
    var paragraphs = text.split(/\n\n+/);
    var chunks = [];
    paragraphs.forEach(function(para, i){
      if(para.length <= MAX_TRANSLATE_CHUNK){
        chunks.push({ text:para, sep: i<paragraphs.length-1 ? '\n\n' : '' });
      } else {
        var sentences = splitIntoSentences(para);
        sentences.forEach(function(s, j){
          chunks.push({ text:s, sep: j<sentences.length-1 ? '' : (i<paragraphs.length-1 ? '\n\n' : '') });
        });
      }
    });
    return chunks;
  }

  async function translateViaGoogle(text, targetCode){
    var chunks = splitForTranslation(text);
    var translated = await Promise.all(chunks.map(function(c){ return translateChunkViaGoogle(c.text, targetCode); }));
    return translated.map(function(t, i){ return t + chunks[i].sep; }).join('');
  }

  async function translateViaClaudeBridge(text, targetCode){
    var response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:2000,
        system:"Translate the user's message into "+LANG_API_NAME[targetCode]+". Reply with only the translated text and nothing else, no preamble, no quotation marks, no explanation.",
        messages:[{ role:"user", content:text }]
      })
    });
    if(!response.ok) throw new Error('Claude bridge translate failed: '+response.status);
    var data = await response.json();
    var out = (data.content||[]).map(function(b){return b.type==='text'?b.text:'';}).join('').trim();
    if(!out) throw new Error('Claude bridge returned no text');
    return out;
  }

  async function translateText(text, targetCode){
    if(!text) return text;
    if(targetCode==='en') return text; // site content is authored in English by default
    var cacheKey = text+'|'+targetCode;
    if(state.translationCache[cacheKey]) return state.translationCache[cacheKey];
    try{
      var out = await translateViaGoogle(text, targetCode);
      state.translationCache[cacheKey] = out;
      return out;
    }catch(err){
      console.error('Translation error (free service)', err);
      try{
        var fallback = await translateViaClaudeBridge(text, targetCode);
        state.translationCache[cacheKey] = fallback;
        return fallback;
      }catch(err2){
        console.error('Translation error (Claude bridge)', err2);
        return '';
      }
    }
  }

  // Translate a piece of text into French and Kinyarwanda in one go (used once, at publish/save time).
  async function translateAll(text){
    if(!text) return { en:'', fr:'', rw:'' };
    var results = await Promise.all([translateText(text,'fr'), translateText(text,'rw')]);
    return { en:text, fr:results[0], rw:results[1] };
  }

  // Small rich-text formatter: **bold**, *italic*, __underline__, ~~strikethrough~~ markers, applied after HTML-escaping.
  function formatRichText(text){
    var escaped = escapeHtml(text);
    escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/__(.+?)__/g, '<u>$1</u>');
    escaped = escaped.replace(/~~(.+?)~~/g, '<del>$1</del>');
    escaped = escaped.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return escaped;
  }

  function wrapSelection(textarea, marker){
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var val = textarea.value;
    var selected = val.slice(start, end);
    if(!selected){ return; }
    var before = val.slice(0, start), after = val.slice(end);
    textarea.value = before + marker + selected + marker + after;
    textarea.focus();
    textarea.selectionStart = start + marker.length;
    textarea.selectionEnd = start + marker.length + selected.length;
  }

  function applyCaseChange(textarea, mode){
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var val = textarea.value;
    var selected = val.slice(start, end);
    if(!selected){ return; }
    var changed;
    if(mode==='upper') changed = selected.toUpperCase();
    else if(mode==='lower') changed = selected.toLowerCase();
    else changed = selected.replace(/\w\S*/g, function(w){ return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); });
    textarea.value = val.slice(0,start) + changed + val.slice(end);
    textarea.focus();
    textarea.selectionStart = start;
    textarea.selectionEnd = start + changed.length;
  }

  function formatToolbarHTML(targetId){

      '<button type="button" class="fmt-btn fmt-case" data-target="'+targetId+'" data-case="capitalize" title="Capitalize">Aa</button>'+
      '<span class="fmt-hint">'+t('formatHint')+'</span>'+

  }

  function wireFormatToolbar(container){
    container.querySelectorAll('.fmt-btn[data-marker]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var ta = document.getElementById(btn.getAttribute('data-target'));
        if(ta) wrapSelection(ta, btn.getAttribute('data-marker'));

    container.querySelectorAll('.fmt-btn[data-case]').forEach(function(btn){

  // ---------------- image handling ----------------
  function resizeImage(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 900;
        var scale = Math.min(1, maxW/img.width);
        var canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------------- storage ----------------
  function postKeyPrefix(pageId, secId){ return 'post_'+pageId+'_'+secId+'_'; }
  function postKey(pageId, secId, postId){ return postKeyPrefix(pageId, secId)+postId; }
  function postOrderKey(pageId, secId){ return 'post_order_'+pageId+'_'+secId; }

  async function savePostOrder(pageId, secId, orderIds, onRetry){
    try{
      await withRetry(function(){ return siteStorage.set(postOrderKey(pageId, secId), JSON.stringify(orderIds), true); }, onRetry);
      state.postOrder[pageId+':'+secId] = orderIds;
      return true;
    }catch(err){
      lastStorageError = err; console.error('Storage error', err);
      return false;
    }
  }

        image: post.image,
        ts: post.ts
      };
    }
    return post;
  }

      text: { en:"At the end of the first year of life, low-birth-weight babies enrolled in the RIMMAP Newborn project automatically move on to the RIMMAP CUFU. CUFU stands for Check-up and Follow-up. This means the children are medically screened and, if necessary, a follow-up begins.\n\nFrom May 4 to 14, the annual Check-up for these children took place at Chez Marraine, the headquarters of our local partner, the NGO UMUBANO-IMPORE (U.I.). This is now the sixth year in a row this check-up has taken place. The AMAKURU team has carried out the Check-up together with U.I. since 2022. This year, Dr. Gabby also took part — an American pediatrician affiliated with the Department of Global Health at the University of Utah, working half-time for the CHUB university hospital in Butare and half-time for our local partner.\n\nIn total we screened 129 RIMMAP children. We can already share that 41 children are in excellent health and received the status Graduated from RIMMAP. Among the remaining children, we saw mild to severe malnutrition, medical problems, or a combination of both, which U.I. staff are now following up with the district hospital's pediatrician.\n\nIn addition to screening the RIMMAP children, we also headed into the hills to screen the children of mothers who are members of a MAMA (Mothers Against Malnutrition Association). All children under 5 from MAMAs Cyendajuru, Mugobore, and Kiruhura were invited, and all accepted! We weighed, measured, and had our pediatricians examine 35 children between 0 and 5. Just like the RIMMAP children, they each received a piece of clothing, a carton of milk, and a packet of biscuits.\n\nAs the AMAKURU team, we don't just contribute our expertise in the field — we're also committed to raising the funds the CUFU needs. Do you feel connected to this project and want to support us? Elsewhere on this site you can find out how. Thank you in advance.\n\u2014 Greet, for AMAKURU", fr:'', rw:'' },

      title: { en:'Murakoze (Thank You) Rwanda 2025\u2026', fr:'', rw:'' },
      text: { en:"This year again, I'm heading back to the land of a thousand hills, this time together with two active supporters of our IMPORE projects, eager to truly see and experience what it's all about. The chairperson of our partner NGO, UMUBANO-IMPORE, will be our guide for a few weeks in rural southern Rwanda.\n\nWe visit the primary school in Simbi. Monique, its wonderful headmistress, shows us around and explains what's been achieved thanks to IMPORE's support: new classrooms for over 1,000 pupils, plans for a kindergarten classroom, a multipurpose hall, a library, a nursing post, and a kitchen that prepares a warm meal every school day for every pupil \u2014 about 100 kg of rice a day. Uniforms were made in our sewing workshop for a large group of very poor children.\n\n'This school, with all its children, is the life's work of its proud but above all grateful headmistress!'\n\nWe accompany Florence on home visits for our project following up babies with low birth weight after discharge from the district hospital \u2014 a confrontation with extreme poverty and malnutrition. Thanks to this approach, child mortality in this group of children has already dropped sharply.\n\nDeep in the hills, we take part in meetings of the MAMAs (Mothers Against Malnutrition Association), supported through Clubhouses where they gather, receive training, and develop activities like knitting, sewing, soap-making, and tofu production. Six clubhouses are already in use; by the end of 2026 we hope to have built 10.\n\nIn Simbi we also meet the parish priest, concerned for families too poor to send their children to secondary school. Last year, donations covered enrollment fees for 4 young people from the parish of Simbi.\n\nThe diplomatic conflict between Rwanda and Belgium hasn't stopped our projects, though it has cost us subsidies from several Belgian cities and municipalities. Private sponsorship from Belgium is unaffected \u2014 to make up the loss, we're now looking for       id: 'seed-claudine-tribute',
      ts: Date.UTC(2026,6,28),
      tag: { en:'Tribute', fr:'Hommage', rw:'Icyubahiro' },
      title: { en:'Claudine Mukeshimana — Chairwoman (posthumous)', fr:'', rw:'' },
      text: { en:"Claudine was born on October 28, 1970, in Maraba, Rwanda.\n\nShe was the daughter of Aloys SIBOMANA, a much-loved, socially committed mayor of her birthplace, a rural region in the hills of Southern Province (Rwanda).\n\nHe cared for his citizens, the poorest citizens first.\n\nThis has continued to inspire Claudine.\n\nShe also loved her mother (Seraphine MUKANKUSI) very much and admired her for her work ethic, her knowledge of plants and herbs, and her entrepreneurship: all qualities that Claudine also integrated into her life.\n\nAfter her studies in Agronomy (1994), she was able to work for the World Food Program as a local project manager.\n\nThis allowed her to provide for her children, her mother, and immediate family members.\n\nIn 1995, she was forced by the genocide to flee to Belgium with her two young children.\n\nShortly after her arrival in Sint-Joris-Weert, she came into contact with Father Guy.\n\nDuring her stay in Belgium, she completed the following studies: Dutch at ILT-Leuven, Bachelor in Tourism, Web Developer training, and Master in Political and Social Economics at UCL (Orientation: Design and management of development projects).\n\nIn 2003, she became chairwoman of the non-profit organization UMUBANO-BISA, which she founded together with two Rwandan friends with the aim of organizing fundraising events to support poor single mothers with young children in Rwanda.\n\nDuring the same period, she met Emeritus Professor Luk Cannoodt, with whom she has formed a close team ever since.\n\nTogether, they launched the IMPORE project (Improving Maternal and Pediatric Outcome: the Rwandan Experience) with the objective of helping to achieve a significant reduction in maternal and child mortality in the Huye district (Southern Rwanda).\n\nIn 2006, they married in Leuven; five years later, they adopted a Rwandan baby named Sam.\n\nIn the following years, various new projects came into being: Chez Marraine, a temporary shelter for babies; follow-up of babies with low birth weight; guidance of poor teenage mothers to become seamstresses; the fight against malnutrition in young children; collaboration with a rural school in Simbi, and more.\n\nIn 2017, the Rwandan partner (NGO UMUBANO-IMPORE) received national recognition from the Rwanda Governance Board, and the name of the Flemish non-profit organization was changed to vzw IMPORE.\n\nClaudine remained chairwoman until her sudden passing on September 1, 2020.\n\nThroughout her life, she dedicated herself fully to the fight against the poverty that still plagues her region.\n\nHer primary goal was to improve the lives of the most vulnerable children and offer them a better future.\n\nThanks to her efforts, many children are alive today, are no longer malnourished, live in a loving environment, can attend school, and have access to healthcare.\n\nClaudine's spirit lives on in all the projects.", fr:'', rw:'' },
      media: [
        {type:'image', image: CLAUDINE_PHOTO, caption:{en:'',fr:'',rw:''}}

      title: { en:'About Chez Marraine', fr:'', rw:'' },
      text: { en:"Chez Marraine (CM) is the headquarters of our local partner, founded by our founder Claudine Mukeshimana. It's located in the Taba neighbourhood of Huye City (formerly Butare), in southern Rwanda, and our activities reach across the whole Huye district from here.\n\nFrom April 2014 until mid-2019, Chez Marraine also served as a temporary shelter for babies who had no mother able to care for them from their very first days. Since 2018, Rwandan authorities place such babies directly with a foster family whenever they can't stay with relatives, so this particular role has wound down \u2014 but several of our other activities at Chez Marraine continue.\n\nSince October 2020, we've run a sewing workshop where poor, single teenage mothers learn to sew; about a dozen have already completed training and most now run an independent sewing practice. During training they receive a warm midday meal, and their babies are cared for in Chez Marraine's social cr\u00e8che.\n\nEach year, Chez Marraine also hosts a general check-up for children aged 1\u20132 with low birth weight whom we've followed for a year, run together with AMAKURU, a team of Flemish volunteers working in maternal and child care. Chez Marraine can also temporarily host mothers with especially vulnerable babies, as well as young volunteers, interns, and visitors supporting our projects.", fr:'', rw:'' },

      text: { en:"Rwanda is one of the very few countries in Africa that met the main Millennium Development Goals by 2015, with major progress on reducing maternal and child mortality. Malnutrition in young children, however, remains a serious problem, especially in poorer rural areas. Our organisation and its Rwandan sister organisation, the NGO UMUBANO-IMPORE, work to improve the life chances of Rwanda's most vulnerable children.\n\nResearch led by our NGO (the August10 study) found that 1 in 5 premature babies in Huye district had already died within 2\u20133 years of hospital discharge \u2014 and of those still alive, 3 in 4 were malnourished. Other children under 5 also face significant risk, especially in the poorest families.\n\nThat's why UMUBANO-IMPORE launched initiatives to tackle malnutrition sustainably. Our local partner works with authorities to secure free public land for associations to grow vegetables and fruit, and to distribute small livestock. Together with local experts and nutritionists, we train mothers in these associations on growing and maintaining vegetable gardens, preparing balanced meals, keeping small livestock for fertiliser, eggs, and protein, and selling part of the harvest for extra income \u2014 supported financially through each association's first two years.", fr:'', rw:'' },

      text: { en:"Research by our local partner in 2015 found that 20% of low-birth-weight babies had already died within 2 years of discharge from Kabutare District Hospital \u2014 and of those still alive, 75% were malnourished. We work to improve quality of life for the most vulnerable children in Huye district by fighting malnutrition and making healthcare more accessible: our support complements rather than replaces regular healthcare, and knowledge-sharing with mothers on nutrition and health is key to better care for at-risk infants.\n\nThe project is called RIMMAP (Reducing Infant Mortality and Morbidity Among Preterms). Since January 2019, our local partner has followed up every discharged baby under 2,500 grams; since May 2024, follow-up focuses on babies under 2,000 grams and multiples \u2014 about 200 babies a year. It has two parts: RIMMAP Newborns, following babies through their first year, and RIMMAP CUFU (Check-up/Follow-up), after their first year.\n\nUnder RIMMAP Newborns, a staff member visits the family shortly after hospital discharge, records living conditions, weighs the baby, and assesses mother and baby's condition. Every baby receives a hand-knitted hat and cocoon, made with love by volunteers in Flanders. Extra feeding, consultations, medication, and transport costs are covered to ensure timely access to care. Since the project began, infant mortality in this group has dropped from 20% to 2.1%.\n\nUnder RIMMAP CUFU, a general check-up takes place at Chez Marraine during the children's second year, run through an ongoing partnership with our West Flemish partner AMAKURU \u2014 doctors, nurses, and a midwife who travel to Rwanda at their own expense each year to examine around 200 children, unpaid. The approach is hands-on, embedded in the local health system, and focused on empowering mothers \u2014 and monthly reports show severe malnutrition dropping sharply as a result.", fr:'', rw:'' },

  function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

  function isRateLimitError(err){
    var msg = (err && err.message) ? err.message : String(err||'');
    return /rate limit/i.test(msg);
  }

  // Remembers why the last save failed, so the person is told whether to simply wait
  // (busy) or to free up space (full) instead of one vague "could not save" message.
  var lastStorageError = null;
  function isStorageFullError(err){
    if(!err) return false;
    if(err.name === 'QuotaExceededError' || err.name === 'NS_ERROR_DOM_QUOTA_REACHED') return true;
    var msg = (err.message ? err.message : String(err)) || '';
    return /quota|exceeded the storage|storage is full/i.test(msg);
  }
  function saveErrorMessage(){
    return isStorageFullError(lastStorageError) ? t('storageFullError') : t('publishError');
  }

  // Retries a storage call several times, with a growing pause between tries, but
  // only when the failure looks like a temporary "too many saves at once" rate
  // limit — any other kind of error is thrown straight away instead of retried.
  // The waits add up to about a minute in total, matching what we tell the person
  // to expect, and onRetry (if given) lets the UI show it's still working instead
  // of looking frozen or broken.
  async function withRetry(fn, onRetry){
    var waits = [3000, 6000, 10000, 15000, 20000]; // ~54s total across 5 retries
    var attempt = 0;
    while(true){
      try{
        return await fn();
      }catch(err){
        if(attempt >= waits.length || !isRateLimitError(err)) throw err;
        var wait = waits[attempt];
        attempt++;
        if(onRetry) onRetry(attempt, waits.length);
        await sleep(wait);
      }
    }
  }

  // ---------------- visitor "write to us" messages ----------------
  // One storage key per message (same lesson as posts — never one big array),
  // so a single message can never take down or lose all the others.
  function visitorMsgKey(id){ return 'visitormsg_'+id; }

  async function saveVisitorMessage(msg, onRetry){
    try{
      await withRetry(function(){ return siteStorage.set(visitorMsgKey(msg.id), JSON.stringify(msg), true); }, onRetry);
      return true;
    }catch(err){
      lastStorageError = err; console.error('Storage error', err);
      return false;
    }
  }

  async function loadVisitorMessages(){
    try{
      var listRes = await withRetry(function(){ return siteStorage.list('visitormsg_', true); });
      var keys = (listRes && listRes.keys) || [];
      var results = await Promise.all(keys.map(function(k){
        return withRetry(function(){ return siteStorage.get(k, true); }).catch(function(){ return null; });
      }));
      var msgs = results.filter(function(r){ return r && r.value; }).map(function(r){ return JSON.parse(r.value); });
      msgs.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      return msgs;
    }catch(err){
      console.error('Could not load messages', err);
      return [];
    }
  }

    try{

  // Reads EVERYTHING in storage and reports what is actually saved, so a missing

  async function scanAllSavedPosts(){
    var keys = [];
    try{
      var res = await withRetry(function(){ return siteStorage.list('', true); });
      keys = (res && res.keys) || [];
    }catch(e){ keys = []; }
    if(!keys.length){
      // Some versions only answer to a real prefix, so try the two we use.
      for(var p=0;p<2;p++){
        var prefix = p===0 ? 'post_' : 'posts_';
        try{
          var r2 = await withRetry(function(){ return siteStorage.list(prefix, true); });
          keys = keys.concat((r2 && r2.keys) || []);
        }catch(e){ /* nothing under this prefix */ }
      }
    }

    var perPostKeys = {};   // full key -> true (these already load normally)
    var legacyKeys = [];    // posts_<page>_<sec>
    keys.forEach(function(k){
      if(k.indexOf('post_')===0) perPostKeys[k] = true;
      else if(k.indexOf('posts_')===0) legacyKeys.push(k);
    });

    var groups = {};        // "page:sec" -> {showing:n, missing:[posts]}
    function group(mapKey){
      if(!groups[mapKey]) groups[mapKey] = { showing:0, missing:[] };
      return groups[mapKey];
    }

    Object.keys(perPostKeys).forEach(function(k){
      var parts = k.split('_');           // post_<page>_<sec>_<id...>
      if(parts.length < 4) return;
      group(parts[1]+':'+parts[2]).showing++;
    });

    // Anything sitting in an old combined entry that has no per-post key yet is
    // saved but not being shown — that is what "restore" puts back.
    for(var i=0;i<legacyKeys.length;i++){
      var lk = legacyKeys[i];
      var lparts = lk.split('_');         // posts_<page>_<sec>
      if(lparts.length < 3) continue;
      var pageId = lparts[1], secId = lparts[2];
      try{
        var got = await withRetry(function(){ return siteStorage.get(lk, true); });
        if(!got || !got.value) continue;
        var arr = JSON.parse(got.value);
        if(!Array.isArray(arr)) continue;
        arr.forEach(function(raw){
          var post = normalizeLegacyPost(raw);
          if(!perPostKeys[postKey(pageId, secId, post.id)]){
            group(pageId+':'+secId).missing.push({ pageId:pageId, secId:secId, post:post });
          }
        });
      }catch(e){ /* unreadable entry — skip it rather than fail the whole scan */ }
    }

    var totalShowing = 0, missing = [];
    Object.keys(groups).forEach(function(mk){
      totalShowing += groups[mk].showing;
      missing = missing.concat(groups[mk].missing);
    });
    return { anyKeys: keys.length>0, groups: groups, totalShowing: totalShowing, missing: missing };
  }

  // ---------------- backup: move content between Claude.ai and a browser ----------------
  // Claude.ai and a plain browser keep content in two separate places, so this writes
  // everything to a single file that can be loaded into the other one. Loading a backup
  // only adds and overwrites — it never clears out what is already there.
  var BACKUP_MARKER = 'umubano-impore-backup';

  async function readEverything(){
    var keys = [];
    try{
      var res = await withRetry(function(){ return siteStorage.list('', true); });
      keys = (res && res.keys) || [];
    }catch(e){ keys = []; }
    if(!keys.length){
      var prefixes = ['post_','posts_','pageheader_','home_story','site_theme','visitormsg_'];
      for(var p=0;p<prefixes.length;p++){
        try{
          var r2 = await withRetry(function(){ return siteStorage.list(prefixes[p], true); });
          keys = keys.concat((r2 && r2.keys) || []);
        }catch(e){ /* nothing under this prefix */ }
      }
    }
    var entries = {};
    for(var i=0;i<keys.length;i++){
      try{
        var got = await withRetry(function(){ return siteStorage.get(keys[i], true); });
        if(got && got.value !== undefined && got.value !== null) entries[keys[i]] = got.value;
      }catch(e){ /* skip anything unreadable rather than fail the whole backup */ }
    }
    return entries;
  }

  function downloadTextFile(filename, text){
    var blob = new Blob([text], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  async function openBackupPanel(){
    var bg = document.createElement('div');
    bg.className = 'modal-bg open';
    var box = document.createElement('div');
    box.className = 'modal modal-wide';
    box.innerHTML =
      '<h3>'+t('backupTitle')+'</h3>'+
      '<p>'+(siteStorage.isNative ? t('backupWhereClaude') : t('backupWhereLocal'))+'</p>'+
      '<h4 style="margin:18px 0 4px;">'+t('backupSaveHeading')+'</h4>'+
      '<p style="margin:0 0 10px;">'+t('backupSaveHelp')+'</p>'+
      '<button class="btn-solid" id="backupSaveBtn">'+t('backupSaveBtn')+'</button>'+
      '<h4 style="margin:22px 0 4px;">'+t('backupLoadHeading')+'</h4>'+
      '<p style="margin:0 0 10px;">'+t('backupLoadHelp')+'</p>'+
      '<label class="file-label">'+t('backupLoadBtn')+'<input type="file" accept="application/json,.json" id="backupLoadInput"></label>'+
      '<div id="backupStatus" style="margin-top:14px; font-weight:600;"></div>'+
      '<div class="modal-actions"><button class="btn-solid" id="backupClose">'+t('cancel')+'</button></div>';
    bg.appendChild(box);
    document.body.appendChild(bg);
    function cleanup(){ if(bg.parentNode) document.body.removeChild(bg); }
    box.querySelector('#backupClose').addEventListener('click', cleanup);
    bg.addEventListener('click', function(e){ if(e.target===bg) cleanup(); });
    var statusEl = box.querySelector('#backupStatus');

    box.querySelector('#backupSaveBtn').addEventListener('click', async function(){
      var btn = box.querySelector('#backupSaveBtn');
      btn.disabled = true; btn.textContent = t('saving');
      var entries = await readEverything();
      var count = Object.keys(entries).length;
      if(!count){
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = t('backupEmpty');
      } else {
        var stamp = new Date().toISOString().slice(0,10);
        downloadTextFile('umubano-impore-backup-'+stamp+'.json', JSON.stringify({
          marker: BACKUP_MARKER, savedAt: new Date().toISOString(), entries: entries
        }));
        statusEl.style.color = 'var(--green-deep)';
        statusEl.textContent = t('backupSaved')(count);
      }
      btn.disabled = false; btn.textContent = t('backupSaveBtn');
    });

    box.querySelector('#backupLoadInput').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = async function(){
        var parsed;
        try{ parsed = JSON.parse(reader.result); }catch(err){ parsed = null; }
        if(!parsed || parsed.marker !== BACKUP_MARKER || !parsed.entries){
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = t('backupBadFile');
          return;
        }
        statusEl.style.color = 'var(--muted)';
        statusEl.textContent = t('backupLoading');
        var keys = Object.keys(parsed.entries);
        var written = 0;
        for(var i=0;i<keys.length;i++){
          try{
            await withRetry((function(k){ return function(){ return siteStorage.set(k, parsed.entries[k], true); }; })(keys[i]));
            written++;
          }catch(err){ break; }   // stop on first real failure; what saved stays saved
          if(i < keys.length-1) await sleep(120);
        }
        if(written === keys.length){
          statusEl.style.color = 'var(--green-deep)';
          statusEl.textContent = t('backupLoaded')(written);
        } else {
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = t('backupLoaded')(written)+' '+t('backupLoadFailed');
        }
        seededPages = {};
        state.posts = {};
        state.homeStory = null;
        await loadSiteTheme();
        renderPage();
      };
      reader.readAsText(file);
    });
  }

  function slugify(text){

  async function seedPageIfNeeded(pageId, secId, existingPosts){
    var mapKey = pageId+':'+secId;
    if(seededPages[mapKey]) return existingPosts;
    seededPages[mapKey] = true;

    var seedList = (mapKey==='home:home') ? RECOVERED_HOME_POSTS : SEED_POSTS_BY_PAGE[mapKey];
    if(!seedList || !seedList.length) return existingPosts;

    // Only add seed posts whose id isn't already present — this lets new seed
    // entries (e.g. a recovered post added later) show up even on a page that
    // already has other posts, without ever duplicating or touching existing ones.
    var existingIds = {};
    existingPosts.forEach(function(p){ existingIds[p.id] = true; });
    var candidates = seedList.filter(function(s){ return !existingIds[s.id]; });
    if(!candidates.length) return existingPosts;

    // A "missing" seed post might be missing because admin deleted it on purpose,
    // not because it was never added — check the tombstone list left by
    // deleteSinglePost() before writing anything back. If that check itself
    // fails, do nothing this time rather than risk undoing a real deletion;
    // it'll simply check again the next time this page loads.
    var missing;
    try{
      var skipRes = await withRetry(function(){ return siteStorage.list('seedskip_', true); });
      var skipIds = {};
      (skipRes && skipRes.keys || []).forEach(function(k){ skipIds[k.slice('seedskip_'.length)] = true; });
      missing = candidates.filter(function(s){ return !skipIds[s.id]; });
    }catch(e){
      return existingPosts;
    }
    if(!missing.length) return existingPosts;

    var saved = existingPosts.slice();
    for(var i=0;i<missing.length;i++){
      try{
        // withRetry absorbs a single dropped request or momentary network hiccup —
        // a real database write can fail transiently even when nothing is actually
        // wrong, so one bad moment must not mean this item (or any after it) never
        // gets seeded at all.
        await withRetry(function(){ return siteStorage.set(postKey(pageId, secId, missing[i].id), JSON.stringify(missing[i]), true); });
        saved.push(missing[i]);
      }catch(e){
        // Even after retrying, this one item still failed — move on to the rest
        // rather than giving up on everything after it. It'll be tried again
        // (and self-heal) the next time this page loads.
        console.error('Could not seed post', missing[i].id, e);
      }
      if(i < missing.length-1) await sleep(600);
    }
    return saved;
  }

  async function migrateLegacyPostsIfNeeded(pageId, secId){
    var mapKey = pageId+':'+secId;
    if(migrationChecked[mapKey]) return;
    migrationChecked[mapKey] = true;
    var oldKey = storageKey(pageId, secId);
    try{
      var res = await siteStorage.get(oldKey, true);
      if(res && res.value){
        var arr = JSON.parse(res.value);
        var results = [];
        for(var i=0;i<arr.length;i++){
          var post = normalizeLegacyPost(arr[i]);
          try{
            await siteStorage.set(postKey(pageId, secId, post.id), JSON.stringify(post), true);
            results.push(true);
          }catch(e){
            results.push(false);
          }
          if(i < arr.length-1) await sleep(600);
        }
        var allSucceeded = results.length>0 && results.every(function(ok){ return ok; });
        if(allSucceeded){
          // Only remove the old combined entry once every post has safely made it
          // into its own key — otherwise we'd risk deleting data that never migrated.
          try{ await siteStorage.delete(oldKey, true); }catch(e){ /* ignore */ }
        }
      }
    }catch(err){
      // no legacy data for this page — nothing to migrate
    }
  }

  async function loadPosts(pageId, secId){
    var mapKey = pageId+':'+secId;
    state.loading[mapKey] = true;
    try{
      // Fetch every post's key AND value in a single round trip (instead of listing
      // keys and then fetching each one separately) — this is what makes posts
      // appear quickly instead of visibly loading one at a time. The old-format
      // migration check and the legacy combined-entry safety net run at the same
      // time rather than one after another, since none of the three depend on
      // each other's result.
      var prefix = postKeyPrefix(pageId, secId);
      var listPromise = (typeof siteStorage.listValues === 'function')
        ? withRetry(function(){ return siteStorage.listValues(prefix, true); })
        : withRetry(function(){ return siteStorage.list(prefix, true); }).then(async function(listRes){
            var keys = (listRes && listRes.keys) || [];
            var results = await Promise.all(keys.map(function(k){
              return withRetry(function(){ return siteStorage.get(k, true); }).catch(function(){ return null; });
            }));
            return { items: results.map(function(res, i){ return res && res.value ? { key:keys[i], value:res.value } : null; }).filter(Boolean) };
          });
      var oldKeyPromise = siteStorage.get(storageKey(pageId, secId), true).catch(function(){ return null; });
      var migratePromise = migrateLegacyPostsIfNeeded(pageId, secId).catch(function(){ /* best-effort */ });
      var orderPromise = siteStorage.get(postOrderKey(pageId, secId), true).catch(function(){ return null; });

      var listRes = await listPromise;
      await migratePromise;
      var oldRes = await oldKeyPromise;
      var orderRes = await orderPromise;

      var posts = (listRes && listRes.items || [])
        .filter(function(item){ return item && item.value; })
        .map(function(item){ return normalizeLegacyPost(JSON.parse(item.value)); });

      // Safety net: if the old combined entry still exists for any reason (e.g. migration
      // couldn't fully complete), merge in any posts from it that aren't already accounted for,
      // so nothing a person already published ever appears to have disappeared.
      try{
        if(oldRes && oldRes.value){
          var oldArr = JSON.parse(oldRes.value);
          var existingIds = {};
          posts.forEach(function(p){ existingIds[p.id] = true; });
          oldArr.forEach(function(rawPost){
            var post = normalizeLegacyPost(rawPost);
            if(!existingIds[post.id]) posts.push(post);
          });
        }
      }catch(e){ /* no legacy data left — that's fine */ }

      posts = await seedPageIfNeeded(pageId, secId, posts);
      posts.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });

      // Admin-arranged order (if any) takes priority — posts placed with the up/down
      // arrows show first, in the order chosen; anything not yet arranged falls in
      // behind them, newest first, so a fresh post never gets "lost" off the end.
      var orderIds = (orderRes && orderRes.value) ? JSON.parse(orderRes.value) : [];
      state.postOrder[mapKey] = orderIds;
      posts = applyOrder(posts, orderIds);

      state.posts[mapKey] = posts;
      writePostsCache(pageId, secId, posts);
    }catch(err){
      // A failed reload (e.g. a rate limit) must never erase posts that were already
      // showing — only replace the list once we actually have a fresh one. If nothing
      // was ever loaded for this page yet, fall back to an empty list so the feed can render.
      if(!state.posts[mapKey]) state.posts[mapKey] = [];
      console.error('Could not reload posts, keeping what was already shown', err);
    }
    state.loading[mapKey] = false;
  }

  // A local, per-browser cache of the last-seen posts for each page, so a
  // returning visitor sees content the instant the page paints instead of
  // staring at an empty feed until the database round trip finishes. This is
  // separate from siteStorage's own localStorage fallback (different key
  // prefix) — it's purely a speed cache, always overwritten by whatever the
  // database actually returns moments later.
  function postsCacheKey(pageId, secId){ return 'pcache_v1_'+pageId+'_'+secId; }
  function readPostsCache(pageId, secId){
    try{
      var raw = localStorage.getItem(postsCacheKey(pageId, secId));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function writePostsCache(pageId, secId, posts){
    try{ localStorage.setItem(postsCacheKey(pageId, secId), JSON.stringify(posts)); }
    catch(e){ /* storage full/unavailable — fine to skip, it's only a speed cache */ }
  }

  async function saveSinglePost(pageId, secId, post, onRetry){
    try{
      await withRetry(function(){ return siteStorage.set(postKey(pageId, secId, post.id), JSON.stringify(post), true); }, onRetry);
      return true;
    }catch(err){
      lastStorageError = err; console.error('Storage error', err);
      return false;
    }
  }

  function isKnownSeedId(id){
    if(RECOVERED_HOME_POSTS.some(function(s){ return s.id===id; })) return true;
    for(var key in SEED_POSTS_BY_PAGE){
      if(SEED_POSTS_BY_PAGE[key].some(function(s){ return s.id===id; })) return true;
    }
    return false;
  }

  async function deleteSinglePost(pageId, secId, postId, onRetry){
    try{
      await withRetry(function(){ return siteStorage.delete(postKey(pageId, secId, postId), true); }, onRetry);
      if(isKnownSeedId(postId)){
        // This was one of the built-in recovered posts — admin deleted it on
        // purpose, so remember that permanently, or the automatic seeding above
        // would otherwise quietly bring it back on a later visit.
        try{ await siteStorage.set('seedskip_'+postId, '1', true); }catch(e){ /* not critical if only this part fails */ }
      }
      return true;
    }catch(err){
      lastStorageError = err; console.error('Storage error', err);
      return false;
    }
  }
