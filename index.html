  async function loadHomeStory(){
    try{
      var res = await siteStorage.get('home_story_v2', true);
      state.homeStory = (res && res.value) ? JSON.parse(res.value) : freshHomeStory();
    }catch(err){
      state.homeStory = freshHomeStory();
    }
    var seedCopy = freshHomeStory();
    Object.keys(seedCopy).forEach(function(key){
      if(state.homeStory[key]===undefined) state.homeStory[key] = seedCopy[key];
    });
    // Repair: if the founder text is still an older default bio, replace it with
    // whatever the current default is. Two older versions are checked here: a
    // short one used earlier, and the full biography that was the default before
    // it was shortened again (the full text now lives on as its own post instead).
    var OLD_FOUNDER_TEXT_EN = "As chairwoman, until her sudden passing on 1 September 2020, Claudine devoted herself fully, all those years, to the fight against the poverty that still prevails in her region. Above all, she wanted to improve the life prospects of the most vulnerable children and give them a future. Thanks in part to her, many children are alive today, are no longer malnourished, live in a loving family, are able to go to school, and have access to healthcare whenever needed.";
    var OLD_FOUNDER_TEXT_EN_FULL_BIO = "Claudine was born on October 28, 1970, in Maraba, Rwanda. She was the daughter of Aloys SIBOMANA, a much-loved, socially committed mayor of her birthplace, a rural region in the hills of Southern Province (Rwanda). He cared for his citizens, the poorest citizens first. This has continued to inspire Claudine. She also loved her mother (Seraphine MUKANKUSI) very much and admired her for her work ethic, her knowledge of plants and herbs, and her entrepreneurship: all qualities that Claudine also integrated into her life. After her studies in Agronomy (1994), she was able to work for the World Food Program as a local project manager. This allowed her to provide for her children, her mother, and immediate family members. In 1995, she was forced by the genocide to flee to Belgium with her two young children. Shortly after her arrival in Sint-Joris-Weert, she came into contact with Father Guy. During her stay in Belgium, she completed the following studies: Dutch at ILT-Leuven, Bachelor in Tourism, Web Developer training, and Master in Political and Social Economics at UCL (Orientation: Design and management of development projects). In 2003, she became chairwoman of the non-profit organization UMUBANO-BISA, which she founded together with two Rwandan friends with the aim of organizing fundraising events to support poor single mothers with young children in Rwanda. During the same period, she met Emeritus Professor Luk Cannoodt, with whom she has formed a close team ever since. Together, they launched the IMPORE project (Improving Maternal and Pediatric Outcome: the Rwandan Experience) with the objective of helping to achieve a significant reduction in maternal and child mortality in the Huye district (Southern Rwanda). In 2006, they married in Leuven; five years later, they adopted a Rwandan baby named Sam. In the following years, various new projects came into being: Chez Marraine, a temporary shelter for babies; follow-up of babies with low birth weight; guidance of poor teenage mothers to become seamstresses; the fight against malnutrition in young children; collaboration with a rural school in Simbi, and more. In 2017, the Rwandan partner (NGO UMUBANO-IMPORE) received national recognition from the Rwanda Governance Board, and the name of the Flemish non-profit organization was changed to vzw IMPORE. Claudine remained chairwoman until her sudden passing on September 1, 2020. Throughout her life, she dedicated herself fully to the fight against the poverty that still plagues her region. Her primary goal was to improve the lives of the most vulnerable children and offer them a better future. Thanks to her efforts, many children are alive today, are no longer malnourished, live in a loving environment, can attend school, and have access to healthcare. Claudine's spirit lives on in all the projects.";
    var currentFounderText = state.homeStory.founderText && state.homeStory.founderText.en && state.homeStory.founderText.en.trim();
    if(currentFounderText === OLD_FOUNDER_TEXT_EN.trim() || currentFounderText === OLD_FOUNDER_TEXT_EN_FULL_BIO.trim()){
      state.homeStory.founderText = { en:HOME_STORY_SEED.founderText.en, fr:HOME_STORY_SEED.founderText.fr, rw:HOME_STORY_SEED.founderText.rw };
      saveHomeStory(state.homeStory);
    }
  }

  async function saveHomeStory(story, onRetry){
    try{
      await withRetry(function(){ return siteStorage.set('home_story_v2', JSON.stringify(story), true); }, onRetry);

  // Splits a block of text into individual sentences (best-effort) so each one
  // can be shown on its own line for easier reading.
  function splitIntoSentences(text){
    return text.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [text];
  }

  function renderStoryView(){
    var target = document.getElementById('storyView');
    if(!target) return;
    var s = state.homeStory;
    var lang = state.lang;
    function pick(field){ return (s[field] && (s[field][lang] || s[field].en)) || ''; }
    function sentenceParas(text){
      var out = '';
      text.split(/\n\s*\n/).forEach(function(para){
        para = para.trim();
        if(!para) return;
        splitIntoSentences(para).forEach(function(sentence){
          sentence = sentence.trim();
          if(!sentence) return;
          var isAcronym = /^IMPORE\s*:/i.test(sentence);
          out += isAcronym ? '<p class="story-acronym">'+formatRichText(sentence)+'</p>' : '<p>'+formatRichText(sentence)+'</p>';
        });
      });
      return out;
    }

    var html = '';

    html += '<div class="founder-section">';
    html += '<h2 class="founder-title">'+formatRichText(pick('founderTitle'))+'</h2>';
    if(s.founderPhoto) html += '<img class="founder-photo" src="'+s.founderPhoto+'">';
    html += '<div class="founder-name">'+formatRichText(pick('founderName'))+'</div>';
    html += sentenceParas(pick('founderText'));
    html += '</div>';

    if(s.images && s.images.length){
      html += '<div class="story-gallery">';
      s.images.forEach(function(src){ html += '<img src="'+src+'">'; });
      html += '</div>';
    }

    target.innerHTML = html;
    target.querySelectorAll('.story-gallery img').forEach(function(img){
      img.addEventListener('click', function(){ openImageLightbox(img.src); });
    });
  }

    document.getElementById('introImgInput').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      resizeImage(file, function(dataUrl){
        introEditImages.push(dataUrl);
        redrawImgGrid();
      });
    });

    document.getElementById('introCancelBtn').addEventListener('click', function(){
      renderPageIntroView(pageId, secId);
    });

    document.getElementById('introSaveBtn').addEventListener('click', async function(){
      saveFieldsIntoLang(introLang);
      var btn = document.getElementById('introSaveBtn');
      btn.disabled = true; btn.textContent = t('publishing');
      var newIntro = { images: introEditImages };
      PAGE_INTRO_FIELDS.forEach(function(f){
        newIntro[f] = { en:introData.en[f].trim(), fr:introData.fr[f].trim(), rw:introData.rw[f].trim() };
      });
      var ok = await savePageIntro(pageId, secId, newIntro, function(){ btn.textContent = t('retrying'); });
      if(ok){
        state.pageIntros[mapKey] = newIntro;
        renderPageIntroView(pageId, secId);
      } else {
        btn.disabled = false; btn.textContent = t('save');
        showToast(saveErrorMessage(), true);
      }
    });
  }

  function renderPageHeaderArea(pageId, secId){
    var mapKey = pageId+':'+secId;
    var heroContainer = document.getElementById('homeHero');
    var controls = document.getElementById('pageHeaderControls');
    if(!heroContainer || !controls) return;
    var img = state.pageHeaders[mapKey];

    var pageName = state.pageTitles[mapKey] || defaultPageTitle(pageId, secId);
    heroContainer.innerHTML = img
      ? '<div class="hero-photo page-hero"><img src="'+img+'">'+
          '<div class="hero-overlay"></div>'+
          '<div class="page-hero-title">'+
            '<span class="ph-brand">'+escapeHtml(siteBrandName())+'</span>'+
            '<span class="ph-page">'+escapeHtml(pageName)+'</span>'+
          '</div>'+
        '</div>'
      : '';

    var html = '';
    if(state.isAdmin){
      if(img) html += '<button class="page-header-remove" id="pageHeaderRemoveBtn">'+t('remove')+'</button>';
      html += '<label class="file-label page-header-upload">'+(img ? t('changePageImage') : t('addPageImage'))+'<input type="file" accept="image/*" id="pageHeaderInput"></label>';
      html += ' <button class="btn-ghost" id="pageTitleEditBtn">'+t('pageTitleEditBtn')+'</button>';
    }
    controls.innerHTML = html;
    var titleBtn = document.getElementById('pageTitleEditBtn');
    if(titleBtn) titleBtn.addEventListener('click', function(){ openPageTitleEditor(pageId, secId); });

    if(state.isAdmin){
      document.getElementById('pageHeaderInput').addEventListener('change', function(e){
        var file = e.target.files[0];
        if(!file) return;
        resizeImage(file, async function(dataUrl){
          var ok = await savePageHeader(pageId, secId, dataUrl);
          if(ok){
            state.pageHeaders[mapKey] = dataUrl;
            renderPageHeaderArea(pageId, secId);
          } else {
            showToast(saveErrorMessage(), true);
          }
        });
      });
      var removeBtn = document.getElementById('pageHeaderRemoveBtn');
      if(removeBtn){
        removeBtn.addEventListener('click', async function(){
          var ok2 = await showConfirmDialog(t('deleteConfirm'));
          if(!ok2) return;
          var ok = await savePageHeader(pageId, secId, null);
          if(ok){
            state.pageHeaders[mapKey] = PAGE_HEADER_DEFAULTS[mapKey] || HERO_PHOTO;
            renderPageHeaderArea(pageId, secId);
          } else {
            showToast(t('deleteError'), true);
          }
        });
      }
    }
  }

  async function renderSectionPage(pageId, secId){
    document.getElementById('homeHero').innerHTML = '';
    var page = findPage(pageId);
    var section = findSection(pageId, secId);
    if(!page || !section){ renderHome(); return; }
    var mapKey = pageId+':'+secId;
    var sectionLabel = sectionDisplayLabel(page, section);

    // No separate crumb/heading/description block here any more — the page's
    // name is already shown on its header photo banner, and the page's own
    // "introduction" (below) carries the heading and description now. Showing
    // both used to mean the page name/title effectively appeared twice.
    var html = '';
    html += '<div id="pageHeaderControls"></div>';

    html += '<div class="story-card" id="pageIntroCard"></div>';

    if(state.isAdmin){
      html += '<div class="composer" id="composer">'+
              langTabsHTML('composerLangTabs')+
              '<input type="text" id="postTag" class="composer-title-input" placeholder="'+t('tagPlaceholder')+'">'+
              '<input type="text" id="postTitle" class="composer-title-input" placeholder="'+t('postTitlePlaceholder')+'">'+
              formatToolbarHTML('postText')+
              '<textarea id="postText" placeholder="'+t('composerSection')(sectionLabel)+'"></textarea>'+
              '<button type="button" class="translate-btn" id="autoTranslateBtn">'+t('autoTranslate')+'</button>'+
              '<div class="media-gallery" id="mediaGallery"></div>'+
              '<div class="composer-row">'+
              '<label class="file-label">'+t('addPhoto')+'<input type="file" accept="image/*,video/*" id="postImg" multiple></label>'+
              '<button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none;">'+t('cancelEdit')+'</button> <button class="post-btn" id="publishBtn">'+t('publish')+'</button>'+
              '</div></div>';
    }

    html += '<div class="feed" id="feed"></div>';
    pageWrap.innerHTML = html;

    if(state.isAdmin){
      wireComposer(pageId, secId, sectionLabel);
    }

    var headerPromise = state.pageHeaders[mapKey]===undefined ? loadPageHeader(pageId, secId) : Promise.resolve();
    var titlePromise = state.pageTitles[mapKey]===undefined ? loadPageTitle(pageId, secId) : Promise.resolve();
    var introPromise = state.pageIntros[mapKey]===undefined ? loadPageIntro(pageId, secId) : Promise.resolve();
    await Promise.all([headerPromise, titlePromise, introPromise]);
    renderPageHeaderArea(pageId, secId);
    renderPageIntroView(pageId, secId);

    // Show whatever posts we already have (this session, or a cache saved
    // last time this browser visited this page) right away, then quietly
    // replace it with fresh data once the real fetch lands.
    var cached = state.posts[mapKey] || readPostsCache(pageId, secId);
    if(cached){ state.posts[mapKey] = cached; renderFeed(pageId, secId); }

    await loadPosts(pageId, secId);
    if(state.currentPage===pageId && state.currentSection===secId){ renderFeed(pageId, secId); }
  }

  function wireComposer(pageId, secId, sectionLabel){
    var composerMedia = []; // [{image, caption:{en,fr,rw}}]
    var composerData = { en:{title:'',text:'',tag:''}, fr:{title:'',text:'',tag:''}, rw:{title:'',text:'',tag:''} };
    var composerLang = 'en';
    var editingPostId = null;
    var tagEl = document.getElementById('postTag');
    var titleEl = document.getElementById('postTitle');
    var textEl = document.getElementById('postText');
    var textPlaceholder = pageId==='home' ? t('composerHome') : t('composerSection')(sectionLabel);
    wireFormatToolbar(document.getElementById('composer'));

    function saveFieldsIntoLang(lang){
      composerData[lang].tag = tagEl.value;
      composerData[lang].title = titleEl.value;
      composerData[lang].text = textEl.value;
    }
    function loadLangIntoFields(lang){
      tagEl.value = composerData[lang].tag;
      titleEl.value = composerData[lang].title;
      textEl.value = composerData[lang].text;
      textEl.placeholder = (lang==='en') ? textPlaceholder : '';
    }

    function loadForEditing(post){
      editingPostId = post.id;
      composerData = {
        en: { title:(post.title&&post.title.en)||'', text:(post.text&&post.text.en)||'', tag:(post.tag&&post.tag.en)||'' },
        fr: { title:(post.title&&post.title.fr)||'', text:(post.text&&post.text.fr)||'', tag:(post.tag&&post.tag.fr)||'' },
        rw: { title:(post.title&&post.title.rw)||'', text:(post.text&&post.text.rw)||'', tag:(post.tag&&post.tag.rw)||'' }
      };
      composerMedia = (post.media||[]).map(function(m){
        return {
          type: m.type||'image', image: m.image, video: m.video,
          caption: { en:(m.caption&&m.caption.en)||'', fr:(m.caption&&m.caption.fr)||'', rw:(m.caption&&m.caption.rw)||'' }
        };
      });
      composerLang = 'en';
      document.querySelectorAll('#composerLangTabs .lang-pill').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-lang')==='en');
      });
      loadLangIntoFields('en');
      renderMediaGallery();
      var publishBtn = document.getElementById('publishBtn');
      publishBtn.textContent = t('saveChanges');
      var cancelBtn = document.getElementById('cancelEditBtn');
      if(cancelBtn) cancelBtn.style.display = 'inline-block';
      var composerEl = document.getElementById('composer');
      if(composerEl) composerEl.scrollIntoView({behavior:'smooth', block:'start'});
    }

    function cancelEditing(){
      editingPostId = null;
      composerData = { en:{title:'',text:'',tag:''}, fr:{title:'',text:'',tag:''}, rw:{title:'',text:'',tag:''} };
      composerMedia = [];
      composerLang = 'en';
      document.querySelectorAll('#composerLangTabs .lang-pill').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-lang')==='en');
      });
      loadLangIntoFields('en');
      renderMediaGallery();
      document.getElementById('publishBtn').textContent = t('publish');
      var cancelBtn = document.getElementById('cancelEditBtn');
      if(cancelBtn) cancelBtn.style.display = 'none';
    }

    composerEditHandlers[pageId+':'+secId] = { loadForEditing:loadForEditing, cancelEditing:cancelEditing };

    var cancelEditBtnEl = document.getElementById('cancelEditBtn');
    if(cancelEditBtnEl) cancelEditBtnEl.addEventListener('click', cancelEditing);

    function renderMediaGallery(){
      var gallery = document.getElementById('mediaGallery');
      if(!gallery) return;
      var html = '';
      composerMedia.forEach(function(item, idx){
        html += '<div class="media-item" data-idx="'+idx+'">';
        if(item.type==='video'){
          html += '<video src="'+item.video+'" controls></video>';
        } else {
          html += '<img src="'+item.image+'">';
        }
        html += '<textarea class="media-caption-input" data-idx="'+idx+'" placeholder="'+t('captionPlaceholder')+'">'+escapeHtml(item.caption[composerLang]||'')+'</textarea>';
        html += '<button type="button" class="media-remove-btn" data-idx="'+idx+'">'+t('remove')+'</button>';
        html += '</div>';
      });
      gallery.innerHTML = html;
      gallery.querySelectorAll('.media-caption-input').forEach(function(ta){
        ta.addEventListener('input', function(){
          var idx = parseInt(ta.getAttribute('data-idx'),10);
          composerMedia[idx].caption[composerLang] = ta.value;
        });
      });
      gallery.querySelectorAll('.media-remove-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-idx'),10);
          composerMedia.splice(idx,1);
          renderMediaGallery();
        });
      });
    }

    document.querySelectorAll('#composerLangTabs .lang-pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        saveFieldsIntoLang(composerLang);
        composerLang = btn.getAttribute('data-lang');
        document.querySelectorAll('#composerLangTabs .lang-pill').forEach(function(b){ b.classList.toggle('active', b===btn); });
        loadLangIntoFields(composerLang);
        renderMediaGallery();
      });
    });

    document.getElementById('autoTranslateBtn').addEventListener('click', async function(){
      saveFieldsIntoLang(composerLang);
      var enTag = composerData.en.tag.trim();
      var enTitle = composerData.en.title.trim();
      var enText = composerData.en.text.trim();
      var hasCaptions = composerMedia.some(function(m){ return m.caption.en.trim(); });
      if(!enTag && !enTitle && !enText && !hasCaptions){ showToast(t('nothingToTranslate'), true); return; }
      var btn = document.getElementById('autoTranslateBtn');
      var originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = t('translating');
      try{
        var calls = [
          enTag ? translateText(enTag,'fr') : Promise.resolve(''),
          enTag ? translateText(enTag,'rw') : Promise.resolve(''),
          enTitle ? translateText(enTitle,'fr') : Promise.resolve(''),
          enTitle ? translateText(enTitle,'rw') : Promise.resolve(''),
          enText ? translateText(enText,'fr') : Promise.resolve(''),
          enText ? translateText(enText,'rw') : Promise.resolve('')
        ];
        var captionMeta = [];
        composerMedia.forEach(function(m, idx){
          var val = m.caption.en.trim();
          if(val){
            calls.push(translateText(val,'fr')); captionMeta.push({idx:idx, lang:'fr'});
            calls.push(translateText(val,'rw')); captionMeta.push({idx:idx, lang:'rw'});
          }
        });
        var results = await Promise.all(calls);
        var frTag=results[0], rwTag=results[1], frTitle=results[2], rwTitle=results[3], frText=results[4], rwText=results[5];
        var succeeded = (enTag && frTag && frTag!==enTag) || (enTag && rwTag && rwTag!==enTag) ||
                        (enTitle && frTitle && frTitle!==enTitle) || (enText && frText && frText!==enText) ||
                        (enTitle && rwTitle && rwTitle!==enTitle) || (enText && rwText && rwText!==enText);
        if(frTag) composerData.fr.tag = frTag;
        if(rwTag) composerData.rw.tag = rwTag;
        if(frTitle) composerData.fr.title = frTitle;
        if(rwTitle) composerData.rw.title = rwTitle;
        if(frText) composerData.fr.text = frText;
        if(rwText) composerData.rw.text = rwText;
        for(var i=6;i<results.length;i++){
          var meta = captionMeta[i-6];
          if(results[i] && results[i]!==composerMedia[meta.idx].caption.en){
            composerMedia[meta.idx].caption[meta.lang] = results[i];
            succeeded = true;
          }
        }
        if(composerLang!=='en'){ loadLangIntoFields(composerLang); renderMediaGallery(); }
        showToast(succeeded ? t('translateSuccess') : t('translateFailed'), !succeeded);
      }catch(err){
        console.error('Auto-translate error', err);
        showToast(t('translateFailed'), true);
      }
      btn.disabled = false; btn.textContent = originalLabel;
    });

    var imgInput = document.getElementById('postImg');
    imgInput.addEventListener('change', function(){
      var files = Array.prototype.slice.call(imgInput.files || []);
      if(!files.length) return;
      var VIDEO_LIMIT_BYTES = 3 * 1024 * 1024; // keep videos small enough to safely fit under the storage limit
      files.forEach(function(file){
        if(file.type && file.type.indexOf('video/')===0){
          if(file.size > VIDEO_LIMIT_BYTES){
            showToast(t('videoTooLarge'), true);
            return;
          }
          var reader = new FileReader();
          reader.onload = function(e){
            composerMedia.push({ type:'video', video:e.target.result, caption:{en:'',fr:'',rw:''} });
            renderMediaGallery();
          };
          reader.readAsDataURL(file);
        } else {
          resizeImage(file, function(dataUrl){
            composerMedia.push({ type:'image', image:dataUrl, caption:{en:'',fr:'',rw:''} });
            renderMediaGallery();
          });
        }
      });
      imgInput.value = '';
    });

    document.getElementById('publishBtn').addEventListener('click', async function(){
      saveFieldsIntoLang(composerLang);
      var hasContent = composerData.en.title || composerData.en.text || composerData.fr.title || composerData.fr.text || composerData.rw.title || composerData.rw.text || composerMedia.length>0;
      if(!hasContent) return;
      var btn = document.getElementById('publishBtn');
      btn.disabled = true; btn.textContent = editingPostId ? t('saving') : t('publishing');
      var mapKey = pageId+':'+secId;
      var titleObj = { en:composerData.en.title.trim(), fr:composerData.fr.title.trim(), rw:composerData.rw.title.trim() };
      var textObj = { en:composerData.en.text.trim(), fr:composerData.fr.text.trim(), rw:composerData.rw.text.trim() };
      var tagObj = { en:composerData.en.tag.trim(), fr:composerData.fr.tag.trim(), rw:composerData.rw.tag.trim() };
      var mediaArr = composerMedia.map(function(m){
        var entry = { type: m.type||'image', caption:{ en:(m.caption.en||'').trim(), fr:(m.caption.fr||'').trim(), rw:(m.caption.rw||'').trim() } };
        if(m.type==='video') entry.video = m.video; else entry.image = m.image;
        return entry;
      });
      var existing = editingPostId ? (state.posts[mapKey]||[]).find(function(p){ return p.id===editingPostId; }) : null;
      // A blank French/Kinyarwanda field when saving an edit almost never means
      // "erase this translation" — it usually just means the admin only touched
      // the English tab. Keep whatever was already saved for a language unless
      // the admin actually typed something new into it.
      if(existing){
        if(!titleObj.fr && existing.title && existing.title.fr) titleObj.fr = existing.title.fr;
        if(!titleObj.rw && existing.title && existing.title.rw) titleObj.rw = existing.title.rw;
        if(!textObj.fr && existing.text && existing.text.fr) textObj.fr = existing.text.fr;
        if(!textObj.rw && existing.text && existing.text.rw) textObj.rw = existing.text.rw;
        if(!tagObj.fr && existing.tag && existing.tag.fr) tagObj.fr = existing.tag.fr;
        if(!tagObj.rw && existing.tag && existing.tag.rw) tagObj.rw = existing.tag.rw;
      }

      // Fill in anything still blank automatically — this is what makes a newly
      // published post already readable in French and Kinyarwanda right away,
      // instead of staying in English until someone remembers to translate it
      // by hand. Uses the free translation service (see translateText above);
      // if that's ever unreachable, the field is simply left as it was rather
      // than blocking the whole publish.
      var autoCalls = [];
      if(!titleObj.fr && titleObj.en) autoCalls.push(translateText(titleObj.en,'fr').then(function(v){ if(v) titleObj.fr = v; }));
      if(!titleObj.rw && titleObj.en) autoCalls.push(translateText(titleObj.en,'rw').then(function(v){ if(v) titleObj.rw = v; }));
      if(!textObj.fr && textObj.en) autoCalls.push(translateText(textObj.en,'fr').then(function(v){ if(v) textObj.fr = v; }));
      if(!textObj.rw && textObj.en) autoCalls.push(translateText(textObj.en,'rw').then(function(v){ if(v) textObj.rw = v; }));
      if(!tagObj.fr && tagObj.en) autoCalls.push(translateText(tagObj.en,'fr').then(function(v){ if(v) tagObj.fr = v; }));
      if(!tagObj.rw && tagObj.en) autoCalls.push(translateText(tagObj.en,'rw').then(function(v){ if(v) tagObj.rw = v; }));
      mediaArr.forEach(function(m){
        if(!m.caption.fr && m.caption.en) autoCalls.push(translateText(m.caption.en,'fr').then(function(v){ if(v) m.caption.fr = v; }));
        if(!m.caption.rw && m.caption.en) autoCalls.push(translateText(m.caption.en,'rw').then(function(v){ if(v) m.caption.rw = v; }));
      });
      if(autoCalls.length){
        if(btn && btn.isConnected) btn.textContent = t('translating');
        await Promise.all(autoCalls);
        if(btn && btn.isConnected) btn.textContent = editingPostId ? t('saving') : t('publishing');
      }

      var post;
      if(editingPostId){
        post = {
          id: editingPostId, title:titleObj, text:textObj, tag:tagObj,
          image: mediaArr.length ? mediaArr[0].image : null,
          media: mediaArr,
          ts: existing ? existing.ts : Date.now()
        };
      } else {
        post = {
          id: Date.now()+'-'+Math.random().toString(36).slice(2,8),
          title:titleObj, text:textObj, tag:tagObj,
          image: mediaArr.length ? mediaArr[0].image : null,
          media: mediaArr,
          ts: Date.now()
        };
      }
      var ok = await saveSinglePost(pageId, secId, post, function(){
        if(btn && btn.isConnected) btn.textContent = t('retrying');
      });
      if(ok){
        var arr = state.posts[mapKey] || [];
        if(editingPostId){
          state.posts[mapKey] = arr.map(function(p){ return p.id===editingPostId ? post : p; });
        } else {
          state.posts[mapKey] = [post].concat(arr);
        }
        editingPostId = null;
        if(pageId==='home'){ renderHome(); } else { renderSectionPage(pageId, secId); } // reset composer + redraw feed
      } else {
        btn.disabled=false; btn.textContent = editingPostId ? t('saveChanges') : t('publish');
        showToast(saveErrorMessage(), true);
      }
    });
  }

  var feedAutoTimer = null;

  // Shows the complete post (full text, all photos/videos, full captions) directly
  // on the page — plain content, no popup box and no dark overlay — instead of
  // expanding the text in place inside the card. A very long post (like a founder
  // biography) would otherwise balloon its card far taller than its neighbours and
  // break the grid, so the feed grid is swapped out for this reading view instead.
  function showPostDetail(post){
    state.viewingPost = post;
    renderPage();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function closePostDetail(){
    state.viewingPost = null;
    renderPage();
  }

  function renderPostDetail(post){
    var heroContainer = document.getElementById('homeHero');
    if(heroContainer) heroContainer.innerHTML = '';

    var title = (post.title && (post.title[state.lang] || post.title.en)) || '';
    var body = (post.text && (post.text[state.lang] || post.text.en)) || '';
    var tag = (post.tag && (post.tag[state.lang] || post.tag.en)) || '';
    var hasMultiMedia = post.media && post.media.length > 0;

    var html = '<button class="post-detail-back" id="postDetailBack">&larr; '+t('backBtn')+'</button>';
    if(tag) html += '<span class="post-tag-pill post-view-tag">'+formatRichText(tag)+'</span>';
    if(title) html += '<h1 class="post-detail-title">'+formatRichText(title)+'</h1>';
    if(hasMultiMedia){
      post.media.forEach(function(m){
        if(m.type==='video' && m.video){
          html += '<video class="post-view-img" src="'+m.video+'" controls></video>';
        } else if(m.image){
          html += '<img class="post-view-img" src="'+m.image+'">';
        }
        var cap = (m.caption && (m.caption[state.lang] || m.caption.en)) || '';
        if(cap) html += '<p class="post-view-text" style="margin-bottom:14px;">'+formatRichText(cap)+'</p>';
      });
      if(body) html += '<p class="post-view-text">'+formatRichText(body)+'</p>';
    } else {
      if(post.image) html += '<img class="post-view-img" src="'+post.image+'">';
      html += '<p class="post-view-text">'+formatRichText(body)+'</p>';
    }

    pageWrap.innerHTML = html;
    document.getElementById('postDetailBack').addEventListener('click', closePostDetail);
  }

  function renderFeed(pageId, secId){
    var feed = document.getElementById('feed');
    if(!feed) return;
    if(feedAutoTimer){ clearInterval(feedAutoTimer); feedAutoTimer = null; }
    var mapKey = pageId+':'+secId;
    var arr = state.posts[mapKey] || [];
    if(arr.length===0){
      feed.innerHTML = '';
      return;
    }

    var layout = (state.siteTheme && state.siteTheme.template) || 'carousel';
    var showCarouselNav = layout === 'carousel';

    var html = '<h2 class="feed-section-title">'+t('ourPostsHeading')+'</h2>';
    if(state.isAdmin && arr.length>1){
      html += '<div style="text-align:center; margin-bottom:4px;"><button class="btn-ghost" id="arrangePostsBtn" type="button" style="padding:4px 14px; font-size:13px;">'+t('arrangePostsBtn')+'</button></div>';
    }
    html += '<div class="feed-section-underline"></div>';
    html += '<div class="feed-carousel-wrap">';
    if(showCarouselNav) html += '<button class="feed-nav feed-nav-prev" id="feedPrev" aria-label="Previous">&#8249;</button>';
    html += '<div class="feed-grid layout-'+layout+'" id="feedTrack">';
    arr.forEach(function(post, i){
      var title = (post.title && (post.title[state.lang] || post.title.en)) || '';
      var tag = (post.tag && (post.tag[state.lang] || post.tag.en)) || '';
      // Photo tile: first photo (or video) fills the whole card, title sits on top
      // of it, and clicking anywhere on the tile opens the full post.
      var firstMedia = (post.media && post.media.length) ? post.media[0] : null;
      var coverVideo = (firstMedia && firstMedia.type==='video') ? firstMedia.video : null;
      var coverImage = coverVideo ? null : ((firstMedia && firstMedia.image) || post.image || null);

      html += '<div class="post-card" data-id="'+post.id+'" data-view="'+post.id+'" style="animation-delay:'+Math.min(i*0.08,0.8)+'s">';
      if(coverVideo){ html += '<video class="post-img" src="'+coverVideo+'" muted playsinline></video>'; }
      else if(coverImage){ html += '<img class="post-img" src="'+coverImage+'" alt="">'; }
      html += '<div class="post-card-scrim"></div>';
      if(tag) html += '<span class="post-tag-pill">'+formatRichText(tag)+'</span>';
      if(state.isAdmin){
        html += '<div class="post-card-admin">'+
                  '<button class="edit-btn" data-edit="'+post.id+'">'+t('editBtn')+'</button>'+
                  '<button class="del-btn" data-del="'+post.id+'">'+t('deleteBtn')+'</button>'+
                '</div>';
      }
      html += '<div class="post-body">';
      if(title) html += '<h3 class="post-title">'+formatRichText(title)+'</h3>';
      html += '<div class="post-tile-readmore">'+t('heroCtaBtn')+' &rarr;</div>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    if(showCarouselNav) html += '<button class="feed-nav feed-nav-next" id="feedNext" aria-label="Next">&#8250;</button>';
    html += '</div>';
    feed.innerHTML = html;

    var track = document.getElementById('feedTrack');
    function scrollByCard(dir){
      if(!track) return;
      var card = track.querySelector('.post-card');
      var cardWidth = card ? card.getBoundingClientRect().width + 20 : 270;
      track.scrollBy({left: dir*cardWidth, behavior:'smooth'});
    }
    var prevBtn = document.getElementById('feedPrev');
    var nextBtn = document.getElementById('feedNext');
    if(prevBtn) prevBtn.addEventListener('click', function(){ scrollByCard(-1); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ scrollByCard(1); });

    // Auto-advance like a slideshow; pauses as soon as the visitor interacts.
    if(track && arr.length > 1 && layout === 'carousel'){
      feedAutoTimer = setInterval(function(){
        var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 6;
        if(atEnd){ track.scrollTo({left:0, behavior:'smooth'}); }
        else { scrollByCard(1); }
      }, 4200);
      var stopAuto = function(){ if(feedAutoTimer){ clearInterval(feedAutoTimer); feedAutoTimer = null; } };
      track.addEventListener('mouseenter', stopAuto);
      track.addEventListener('touchstart', stopAuto, {passive:true});
      track.addEventListener('wheel', stopAuto, {passive:true});
    }

    feed.querySelectorAll('[data-view]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-view');
        var post = (state.posts[mapKey]||[]).find(function(p){ return p.id===id; });
        if(post) showPostDetail(post);
      });
    });

    if(state.isAdmin){
      // stopPropagation keeps Edit/Delete from also opening the post, since the
      // whole tile is clickable.
      feed.querySelectorAll('[data-edit]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var id = btn.getAttribute('data-edit');
          var post = (state.posts[mapKey]||[]).find(function(p){ return p.id===id; });
          var handlers = composerEditHandlers[mapKey];
          if(post && handlers) handlers.loadForEditing(post);
        });
      });
      feed.querySelectorAll('[data-del]').forEach(function(btn){
        btn.addEventListener('click', async function(e){
          e.stopPropagation();
          var ok2 = await showConfirmDialog(t('deleteConfirm'));
          if(!ok2) return;
          var id = btn.getAttribute('data-del');
          var ok = await deleteSinglePost(pageId, secId, id);
          if(ok){
            state.posts[mapKey] = (state.posts[mapKey]||[]).filter(function(p){return p.id!==id;});
            renderFeed(pageId, secId);
          } else {
            showToast(t('deleteError'), true);
          }
        });
      });
      var arrangeBtn = document.getElementById('arrangePostsBtn');
      if(arrangeBtn){
        arrangeBtn.addEventListener('click', function(){ openArrangePostsPanel(pageId, secId); });
      }
    }
  }

  function openArrangePostsPanel(pageId, secId){
    var mapKey = pageId+':'+secId;
    var posts = (state.posts[mapKey] || []).slice();
    var bg = document.createElement('div');
    bg.className = 'modal-bg open';
    var box = document.createElement('div');
    box.className = 'modal modal-wide';
    box.innerHTML = '<h3>'+escapeHtml(t('arrangePostsTitle'))+'</h3>'+
      '<p style="color:var(--muted); font-size:13.5px;">'+escapeHtml(t('arrangePostsHint'))+'</p>'+
      '<div id="apList"></div>'+
      '<div class="modal-actions">'+
        '<button class="btn-solid" id="apSaveBtn">'+escapeHtml(t('renamePagesBtn'))+'</button>'+
        '<button class="btn-solid" id="apClose">'+escapeHtml(t('cancel'))+'</button>'+
      '</div>';
    bg.appendChild(box);
    document.body.appendChild(bg);
    function cleanup(){ if(bg.parentNode) document.body.removeChild(bg); }
    box.querySelector('#apClose').addEventListener('click', cleanup);
    bg.addEventListener('click', function(e){ if(e.target===bg) cleanup(); });

    // Working copy, edited live as the up/down arrows are clicked, only written
    // to storage once "Save changes" is pressed — same pattern as Manage pages.
    var workingOrder = posts.map(function(p){ return p.id; });
    var byId = {}; posts.forEach(function(p){ byId[p.id] = p; });

    function renderArrangeList(){
      var el = box.querySelector('#apList');
      el.innerHTML = workingOrder.map(function(id, idx, arr){
        var p = byId[id];
        if(!p) return '';
        var title = (p.title && (p.title[state.lang] || p.title.en)) || '('+t('tagPlaceholder')+')';
        return '<div style="display:flex; align-items:center; gap:10px; margin:6px 0; border-bottom:1px solid var(--green-line); padding-bottom:6px;">'+
          '<span style="display:flex; flex-direction:column; gap:1px;">'+
            '<button type="button" class="mp-order-btn" data-move-post="'+id+'|up"'+(idx===0?' disabled':'')+'>&#9650;</button>'+
            '<button type="button" class="mp-order-btn" data-move-post="'+id+'|down"'+(idx===arr.length-1?' disabled':'')+'>&#9660;</button>'+
          '</span>'+
          '<span style="flex:1;">'+escapeHtml(title)+'</span>'+
        '</div>';
      }).join('');
      el.querySelectorAll('[data-move-post]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var parts = btn.getAttribute('data-move-post').split('|');
          var idx = workingOrder.indexOf(parts[0]);
          var swapWith = parts[1]==='up' ? idx-1 : idx+1;
          if(swapWith<0 || swapWith>=workingOrder.length) return;
          var tmp = workingOrder[idx]; workingOrder[idx] = workingOrder[swapWith]; workingOrder[swapWith] = tmp;
          renderArrangeList();
        });
      });
    }
    renderArrangeList();

    box.querySelector('#apSaveBtn').addEventListener('click', async function(){
      var saveBtn = box.querySelector('#apSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = t('saving');
      var ok = await savePostOrder(pageId, secId, workingOrder.slice(), function(){ saveBtn.textContent = t('retrying'); });
      saveBtn.disabled = false; saveBtn.textContent = t('renamePagesBtn');
      if(ok){
        state.posts[mapKey] = applyOrder(posts, workingOrder);
        renderFeed(pageId, secId);
        showToast(t('pageNamesSaved'));
        cleanup();
      } else {
        showToast(saveErrorMessage(), true);
      }
    });
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------------- init ----------------
  refreshModalText();
  document.getElementById('sidebarTitle').textContent = t('menu');
  renderSidebar();
  renderPage();
  loadSiteTheme();
  loadFooterInfo();
  loadCustomPages();
  loadPageLabelOverrides();
  loadNavOrder();

  var toTopBtn = document.getElementById('toTopBtn');
  if(toTopBtn){
    toTopBtn.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
    window.addEventListener('scroll', function(){
      toTopBtn.classList.toggle('show', window.scrollY > 400);
    }, {passive:true});
  }

  // Stay signed in across page reloads if there's already a valid Supabase session
  // on this device (e.g. admin signed in earlier today), instead of asking again.
  if(supabaseClient){
    supabaseClient.auth.getSession().then(function(res){
      if(res.data && res.data.session){
        state.isAdmin = true;
        rememberAdminDevice();
        renderSidebar();
        renderPage();
        renderFooter();
      }
    });
  }
})();
</script>
</body>
</html>
